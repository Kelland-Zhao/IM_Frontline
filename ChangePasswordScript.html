<script>
  /**
   * ==========================================
   * 页面安全防护设置
   * ==========================================
   * 禁用鼠标右键菜单与浏览器的开发者调试快捷键 (F12, Ctrl+Shift+I)
   */
  window.onload = function() {       
    document.onkeydown = function() {
      let e = window.event || arguments[0];
      if (e.keyCode == 123) {         
        return false;
      } else if ((e.ctrlKey) && (e.shiftKey) && (e.keyCode == 73)) {
        return false;
      }
    }
    document.oncontextmenu = function() {
      return false;
    }
  }
  
  /**
   * ==========================================
   * 页面初始化监听
   * ==========================================
   * 绑定工号输入框的实时检测事件，自动带出员工姓名
   */
  document.addEventListener('DOMContentLoaded', function() {
    document.getElementById("changePasswordId").addEventListener("change", idToName); 
  });

  /**
   * ==========================================
   * 根据工号获取员工姓名 (接入新版后端安全引擎)
   * ==========================================
   * 废除了旧版不安全的本地取值，改为从后端实时请求脱敏的姓名信息。
   */
  function idToName() { 
    let changePasswordId = document.getElementById("changePasswordId").value;
    let nameInput = document.getElementById("changePasswordName");
    
    // 拦截不合规的位数
    if (changePasswordId.length !== 5) {                          
      nameInput.value = "";
      Swal.fire({allowOutsideClick: false, icon: 'error', title: '提醒', text: '请输入5位工号', showConfirmButton: true});
      return;
    }
    
    // 请求后端拉取员工脱敏信息
    google.script.run.withSuccessHandler(function(res) {
      if (res.status === "OK") {
        nameInput.value = res.data.name;
      } else {
        nameInput.value = "未找到用户";
      }
    }).getUserInfoById(changePasswordId);
  }

  /**
   * ==========================================
   * 更改用户密码核心提交流程
   * ==========================================
   * 包含前端强密码正则校验、后端旧密码比对、以及最终密码覆盖入库
   */
  function changeUserPassword() {
    // 强制要求：包含数字、大写字母、小写字母、特殊字符，总长度 8~30 位
    let strongRegex = new RegExp('(?=.*[0-9])(?=.*[A-Z])(?=.*[a-z])(?=.*[^a-zA-Z0-9]).{8,30}');
    let changePasswordId = document.getElementById("changePasswordId").value; 
    let changePasswordOld = document.getElementById("changePasswordOld").value;
    let changePasswordNew = document.getElementById("changePasswordNew").value;
    
    // 1. 基础表单完整性校验
    if (changePasswordId === "" || changePasswordId.length !== 5) {
      Swal.fire({allowOutsideClick: false, icon: 'error', title: '提醒', text: '工号不可为空且必须为5位，请重新输入', showConfirmButton: true});
      return false;
    }
    if (changePasswordOld.length === 0) {
      Swal.fire({allowOutsideClick: false, icon: 'error', title: '提醒', text: '请输入原密码', showConfirmButton: true});
      return false;
    }
    if (!strongRegex.test(changePasswordNew)) {
      Swal.fire({allowOutsideClick: false, icon: 'error', title: '您的密码复杂度太低', text: '密码中必须包含大小写字母、数字、特殊字符，长度不低于8，不高于30', showConfirmButton: true});
      return false;
    }
    
    Swal.fire({allowOutsideClick: false, icon: 'info', title: '提醒', text: "正在核对身份并更新密码……", showConfirmButton: false, footer: '<p>完成窗口会自动关闭</p>'});
    
    // 2. 借助新版后端登录接口，安全比对原密码是否正确
    google.script.run.withSuccessHandler(function(verifyRes) {
      if (verifyRes.status === "OK") {
        
        // 3. 原密码正确，正式向后端提交更新新密码
        google.script.run.withSuccessHandler(function(updateRes) {
          if (updateRes[0] === "OK") {
            // 清空表单
            document.getElementById("changePasswordId").value = "";
            document.getElementById("changePasswordOld").value = "";
            document.getElementById("changePasswordName").value = "";
            document.getElementById("changePasswordNew").value = "";
            
            Swal.fire({allowOutsideClick: false, icon: 'success', title: '提醒', text: '密码更新成功！', showConfirmButton: false, timer: 1500});
          } else {
            Swal.fire({allowOutsideClick: false, icon: 'error', title: '提醒', text: '密码更新失败：' + updateRes[1], showConfirmButton: true});
          }
        }).writeChangePassword(changePasswordId, changePasswordNew);
        
      } else {
        // 原密码错误拦截
        Swal.fire({allowOutsideClick: false, icon: 'error', title: '提醒', text: '原密码不正确，请重新输入', showConfirmButton: true});
      }
    }).verifyUserLogin(changePasswordId, changePasswordOld);
  }  
</script>
