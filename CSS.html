<style type="text/css">
  
  /* ================= 悬浮按钮通用样式 ================= */
  .floating-btn {
    position: fixed;            /* 固定定位，使按钮不随页面滚动 */
    top: 5px;                   /* 距离视口顶部 5px */
    left: 5px;                  /* 距离视口左侧 5px */
    z-index: 9999;              /* 极高的层级，确保显示在最顶层 */
    padding: 2px 2px;           /* 极小的内边距，依赖内容或宽高撑开 */
    /* 改为红色调渐变，提升视觉热度与警示性 */
    background: linear-gradient(90deg, #fa4949 60%, #fa8843 100%);
    border: none;               /* 移除默认边框 */
    color: #fff;                /* 纯白文字/图标颜色 */
    border-radius: 8px;         /* 现代化的微圆角 */
    font-size: 3rem;            /* 超大图标/文字尺寸 */
    box-shadow: 0 2px 7px rgba(220, 120, 120, 0.17); /* 跟随主色调的红色柔和阴影 */
    cursor: pointer;            /* 鼠标悬停显示小手 */
    opacity: 0.95;              /* 默认轻微透明，融入背景 */
    transition: box-shadow 0.15s, transform 0.12s; /* 阴影和缩放的顺滑过渡动画 */
  }

  .floating-btn:hover {
    box-shadow: 0 4px 15px rgba(250, 73, 73, 0.13); /* 鼠标悬停时，阴影扩散变亮 */
    transform: scale(1.03);     /* 鼠标悬停时微微放大，提供物理按压反馈 */
    opacity: 1;                 /* 恢复 100% 不透明度 */
  }

  /* ================= 容器与整体布局 ================= */
  .container {       
    max-width: 100%;            /* 取消 Bootstrap 默认的最大宽度限制 */
    width: 98%;                 /* 留出两侧各 1% 的呼吸空间 */

  /* ================= 顶部居中红色大标题 ================= */
  .zjtext-center {
    display: flex;              /* 采用 Flex 布局 */
    align-items: center;        /* 垂直居中 */
    justify-content: center;    /* 水平居中 */
    background-color: rgb(218, 41, 28); /* 品牌标志性的高露洁红 */
    color: white;               /* 文字反白 */
    padding: 10px;              /* 上下左右 10px 留白 */
    border-radius: 40px;        /* 胶囊状的巨大圆角 */
    position: relative;         /* 相对定位，为了让内部绝对定位的图片做参照物 */
  }

  /* 标题内部的配图通用设置 */
  .zjtext-center img {
    position: absolute;         /* 绝对定位，脱离正常文档流，贴在标题两侧 */
  }

  /* 标题内部的第一张图（靠左） */
  .zjtext-center img:first-child {
    left: 10px;                 /* 紧贴左侧 10px 处 */
  }

  /* 标题内部的最后一张图（靠右） */
  .zjtext-center img:last-child {
    right: 10px;                /* 紧贴右侧 10px 处 */
  }

  /* ================= Bootstrap Select 下拉框重置 ================= */

  /* ================= 表格内嵌输入组件透明化 ================= */
  /* 表格中的 Input：隐身融入单元格 */
  .tabInputNone {
    border-left: none;
    border-top: none;
    border-right: none;
    border-bottom: none;
    background-color: unset;    /* 去掉白底 */
    outline: none;              /* 移除选中蓝框 */

  }
  
  /* 表格中的 Textarea：隐身并垂直居中 */
  .tabTextareaNone {
    border: none;
    background-color: unset;
    outline: none;
    width: 100%;
    overflow-y: hidden;         /* 隐藏滚动条 */
    text-align: center;
    display: table-cell;        /* 模拟表格单元格行为 */
    vertical-align: middle;     /* 垂直居中对齐 */
    resize: none;               /* 禁止用户拖拽右下角拉伸大小 */
  }
  
  /* 表格中的 Select：隐身融入单元格 */
  .tabSelectNone {
    border: none;
    background-color: unset;
    outline: none;
    text-align: center;
    text-align-last: center;    /* 强制选中的文字也必须居中 */
    width: 100%;
    height: 100%;
  }

  /* ================= 冻结表头、首尾列的大型矩阵表格 (frozenTableRC) ================= */
  .frozenTableRC {
    /* 核心魔法：使用 calc 动态算出剩余高度。260px 是减去头部标题和过滤框的大约高度，防止撑爆屏幕 */
    height: calc(100vh - 260px) !important;
    overflow: auto;             /* 内容溢出时开启十字滚动条 */
    border-bottom: 1px solid #dee2e6; /* 底部封边 */
    width: 100%;
    margin: auto;               /* 居中 */
    position: sticky;           /* 提供粘性定位的基础 */
  }
  
  .frozenTableRC table {
    position: sticky;
    z-index: 0;                 /* 正常内容的层级最低 */
  }
   
  .frozenTableRC td, th {
    margin: 0px;
    padding-left: 5px;          /* 左右内边距压缩 */
    padding-right: 5px;
    padding-top: 0px;
    padding-bottom: 0px;
    height: 60px;               /* 强制锁死行高 */
  }
  
  .frozenTableRC tbody tr {
    border-bottom: 1px solid #e9ecef; /* 极其柔和的浅灰细线分隔行 */
    transition: all 0.2s ease-in-out; /* 让鼠标悬浮变色更丝滑 */
  }
  
  /* 给表格单元格增加一点上下呼吸空间 */
  .frozenTableRC td, .frozenTableRC th {
    padding-top: 4px !important;
    padding-bottom: 4px !important;
  }
  
  /* ------ 冻结（Sticky）矩阵配置 ------ */
  /* 冻结首行抬头 */
  .frozenTableRC thead tr th { 
    position: sticky;
    top: 0px;                   /* 锁定在视窗顶部 */
    z-index: 2;                 /* 盖住普通内容 */
    background-color: whitesmoke;
  }
  
  /* 左侧冻结列：第 1 列 */
  .frozenTableRC thead th:nth-child(1) { position: sticky; left: 0px; z-index: 3; background-color: whitesmoke; }
  .frozenTableRC tbody td:nth-child(1) { position: sticky; left: 0px; z-index: 1; background-color: #CCFFFF; }

  /* 左侧冻结列：第 2 列 */
  .frozenTableRC thead th:nth-child(2) { position: sticky; left: 0px; z-index: 3; background-color: whitesmoke; }
  .frozenTableRC tbody td:nth-child(2) { position: sticky; left: 0px; z-index: 1; background-color: white; }

  /* 左侧冻结列：第 3 列 (固定偏移量) */
  .frozenTableRC thead th:nth-child(3) { position: sticky; left: 80px; z-index: 3; background-color: whitesmoke; }
  .frozenTableRC tbody td:nth-child(3) { position: sticky; left: 80px; z-index: 1; background-color: white; }

  /* 左侧冻结列：第 4 列 */
  .frozenTableRC thead th:nth-child(4) { position: sticky; left: 160px; z-index: 3; background-color: whitesmoke; }
  .frozenTableRC tbody td:nth-child(4) { position: sticky; left: 160px; z-index: 1; background-color: white; }

  /* 左侧冻结列：第 5 列 */
  .frozenTableRC thead th:nth-child(5) { position: sticky; left: 220px; z-index: 3; background-color: whitesmoke; }
  .frozenTableRC tbody td:nth-child(5) { position: sticky; left: 220px; z-index: 1; background-color: white; }

  /* 左侧冻结列：第 6 列 */
  .frozenTableRC thead th:nth-child(6) { position: sticky; left: 300px; z-index: 3; background-color: whitesmoke; }
  .frozenTableRC tbody td:nth-child(6) { position: sticky; left: 300px; z-index: 1; background-color: white; }
  
  /* 左侧冻结列：第 7 列 */
  .frozenTableRC thead th:nth-child(7) { position: sticky; left: 380px; z-index: 3; background-color: whitesmoke; }
  .frozenTableRC tbody td:nth-child(7) { position: sticky; left: 380px; z-index: 1; background-color: white; }
  
  /* 左侧冻结列：第 8 列 (高亮警示底色) */
  .frozenTableRC thead th:nth-child(8) { position: sticky; left: 480px; z-index: 3; background-color: whitesmoke; }
  .frozenTableRC tbody td:nth-child(8) { position: sticky; left: 480px; z-index: 1; background-color: lightpink; }

  /* 右侧冻结列：倒数第 3 列 */
  .frozenTableRC thead th:nth-last-child(3) { position: sticky; right: 0px; z-index: 3; background-color: whitesmoke; }
  .frozenTableRC tbody td:nth-last-child(3) { position: sticky; right: 0px; z-index: 1; background-color: #CCFFFF; }
  
  /* 右侧冻结列：倒数第 2 列 */
  .frozenTableRC thead th:nth-last-child(2) { position: sticky; right: 0px; z-index: 3; background-color: whitesmoke; }
  .frozenTableRC tbody td:nth-last-child(2) { position: sticky; right: 0px; z-index: 1; background-color: #CCFFFF; }

  /* 右侧冻结列：倒数第 1 列 */
  .frozenTableRC thead th:nth-last-child(1) { position: sticky; right: 0px; z-index: 3; background-color: whitesmoke; }
  .frozenTableRC tbody td:nth-last-child(1) { position: sticky; right: 0px; z-index: 1; background-color: #CCFFFF; }

  /* 悬停整行变色互动 */
  .frozenTableRC tbody tr:hover { 
    position: sticky;
    color: cyan;                /* 文字发青光 */
    transition: .2s;            /* 平滑淡入 */
  }
  
  /* ================= 仅冻结表头的表格 (frozenTableR) ================= */
  .frozenTableR {
    width: 100%;
    margin: auto;
    overflow-y: scroll;         /* 只开启垂直滚动 */
    position: sticky;
  }
  
  .frozenTableR table {
    position: sticky;
    z-index: 0;
  }
   
  .frozenTableR td, th {
    margin: 0px;
    padding-left: 5px;
    padding-right: 5px;
    padding-top: 0px;
    padding-bottom: 0px;
    height: 30px;               /* 行高较紧凑 */
  }
  
  .frozenTableR tbody tr {
    border-bottom: 1px solid #000; /* 底部使用硬黑线分隔 */
  }
  
  /* 冻结抬头为高露洁红 */
  .frozenTableR thead tr th { 
    position: sticky;
    top: 0px;
    z-index: 2;
    background-color: rgb(218, 41, 28);
    color: white;
  }

  /* 斑马纹交替底色 */
  .frozenTableR tbody tr:nth-child(2n+1) { 
    background-color: #F2F2F2; 
  }

  .frozenTableR tbody tr:hover { 
    position: sticky;
    color: cyan;
    transition: .2s;
  }

  /* ================= 圆形按钮尺寸控制 ================= */

  /* ================= 呼吸灯 (闪烁) 动画系列 ================= */
  
  /* Primary 呼吸蓝 */
  .btn-twinkle-primary {
    color: #fff;
    border: none;
    animation: twinkle-primary 0.5s alternate infinite; /* alternate 让来回平滑过渡 */
  }
  @keyframes twinkle-primary {
    from { background: #0275d8; }
    to { background: #ffffff00; } /* 渐变到全透明 */
  }
  
  /* Secondary 呼吸黑灰 */
  .btn-twinkle-secondary {
    color: #fff;
    border: none;
    animation: twinkle-secondary 0.5s alternate infinite;
  }
  @keyframes twinkle-secondary {
    from { background: #292b2c; }
    to { background: #ffffff00; }
  }
  
  /* Success 呼吸绿 */
  .btn-twinkle-success {
    color: #fff;
    border: none;
    animation: twinkle-success 0.5s alternate infinite;
  }
  @keyframes twinkle-success {
    from { background: #5cb85c; }
    to { background: #ffffff00; }
  }
  
  /* Warning 呼吸黄 */
  .btn-twinkle-warning {
    color: #fff;
    border: none;
    animation: twinkle-warning 0.5s alternate infinite;
  }
  @keyframes twinkle-warning {
    from { background: #f0ad4e; }
    to { background: #ffffff00; }
  }
  
  /* Danger 呼吸红 */
  .btn-twinkle-danger {
    color: #fff;
    border: none;
    animation: twinkle-danger 0.5s alternate infinite;
  }
  @keyframes twinkle-danger {
    from { background: #d9534f; }
    to { background: #ffffff00; }
  }
  
  /* Info 呼吸浅青 */
  .btn-twinkle-info {
    color: #fff;
    border: none;
    animation: twinkle-info 0.5s alternate infinite;
  }
  @keyframes twinkle-info {
    from { background: #5bc0de; }
    to { background: #ffffff00; }
  }
  
  /* Inverse 呼吸反黑 */
  .btn-twinkle-inverse {
    color: #fff;
    border: none;
    animation: twinkle-inverse 0.5s alternate infinite;
  }
  @keyframes twinkle-inverse {
    from { background: #292b2c; }
    to { background: #ffffff00; }
  }
  
  /* Faded 呼吸浅灰底 */
  .btn-twinkle-faded {
    color: #fff;
    border: none;
    animation: twinkle-faded 0.5s alternate infinite;
  }
  @keyframes twinkle-faded {
    from { background: #f7f7f7; }
    to { background: #ffffff00; }
  }
  
  /* 覆盖通用按钮聚焦或悬浮时的边框、文字反馈，防止眼花 */
  .btn-primary:hover, .btn-primary:focus,
  .btn-secondary:hover, .btn-secondary:focus,
  .btn-info:hover, .btn-info:focus,
  .btn-danger:hover, .btn-danger:focus,
  .btn-warning:hover, .btn-warning:focus,
  .btn-success:hover, .btn-success:focus {
    color: #000;
    border-color: #000;
  }

  /* 极致紧凑的小按钮修饰 */
  .btn-xs {
    padding: 0.0rem 0.0rem;     /* 剥离内边距 */
    font-size: 0.8rem;          /* 设置与 h6 元素相同的字体大小 */
    line-height: inherit;       /* 继承父元素的行高 */
  }

  /* 下拉按钮旁边的追加操作按键 */
  .input-group-prepend a {
    background-color: #FFC312;
    color: black;
    border: 0 !important;
  }

  /* ================= 布局图拾取器特有样式 ================= */
  .layout-table td {
    border: 1px solid #dee2e6;  /* 细边框更清爽 */
    transition: all 0.2s ease;  /* 点击时有个平滑变色的动画 */
