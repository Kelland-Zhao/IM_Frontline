  /**
   * 绑定扫码枪限时输入逻辑，防止手工键盘输入混淆
   */
  (function bindScanLimiter(){
    const LIMITED_MS_FAST = 40;
    const LIMITED_MS_SLOW = 20000;
    let lastInputTS = 0;

    $doc.on("input", "input[name^='" + SCAN_INPUT_NAME + "']", function(){
      lastInputTS = Date.now();
    });

    $doc.on("keydown", "input[name^='" + SCAN_INPUT_NAME + "']", function(){
      const enableScanFast = $("#enableScanInputIf").is(":checked");
      const limit = enableScanFast ? LIMITED_MS_FAST : LIMITED_MS_SLOW;
      const dt = Math.abs(Date.now() - lastInputTS);
      const $this = $(this);
   
      if ($this.val().length > 1 && dt > limit) {
        $this.val("");
      }
    });
  })();

  /**
   * ==========================================
   * IndexedDB 数据库封装模块
   * ==========================================
   */
  let dbPromise = null;

  function openDB() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open('cp_app_db', 1);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('kv')) {
          db.createObjectStore('kv');
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
      req.onblocked = () => console.warn('IndexedDB 升级被阻塞');
    });
    return dbPromise;
  }

  async function idbGet(key) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('kv', 'readonly');
      const req = tx.objectStore('kv').get(key);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function idbSet(key, value) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('kv', 'readwrite');
      tx.objectStore('kv').put(value, key);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
    });
  }

  /**
   * 初始化单个自检任务面板的数据
   */
  async function initSingleTaskPane(index, task) {
    const $pane = $("#pane-" + index);
    let isDuplicateMachine = false;
    let taskQueue = JSON.parse(sessionStorage.getItem("multiTaskQueue") || "[]");
    for (let j = 0; j < index; j++) {
      if (taskQueue[j].machine === task.machine) {
        isDuplicateMachine = true;
        break;
      }
    }
    window["isDuplicateMachine_" + index] = isDuplicateMachine;

    $("#usernameID_" + index).val(sessionStorage.getItem("viewName"));
    $("#SAPCodeID_" + index).val(sessionStorage.getItem("viewId"));
    $("#workshopID_" + index).val(sessionStorage.getItem("selfCheckDep"));
    $("#timeInputID_" + index).val(moment().format("YYYY-MM-DD HH:mm:ss"));
    $("#lineInputBoxID_" + index).val(task.machine);
    $("#materialInputID_" + index).val(task.sku);
    $("#lineMoldType_" + index).val(task.moldType || sessionStorage.getItem("selfCheckBomMoldType"));
    
    const machineModelStr = task.machineModel || sessionStorage.getItem("selfCheckMachineModel") || "";
    if (task.machine.startsWith("V") && machineModelStr.indexOf("6Aix") !== -1) {
      $("#divParmeterInjection_" + index).hide();
      $("#divParmeterInjection_" + index).before("<div class='alert alert-secondary text-center'><b>" + task.machine + "</b> 属于 6Aix 副机，无需检查工艺参数。</div>");
    }

    let arrCurrentSelfCheckInfo = arrInjAllSelfCheckRecord.filter(function(v) { return v[0] === task.machine.split(",")[0]; });
    let checkNum = arrCurrentSelfCheckInfo.length > 0 ? arrCurrentSelfCheckInfo[0][1] + 1 : 1;
    $("#selfCheckNum_" + index).val(checkNum);
    $("#tab-badge-" + index).text("第" + checkNum + "次");

    if (checkNum > 4) {
      $("#recordSubmit_" + index).prop("disabled", true).text("已达4次上限");
      return;
    }

    $("#selfCheckShiftModel_" + index).val(task.shiftModel || sessionStorage.getItem("selfCheckShiftModel") || "");
    let cellSafe = task.moldCell || sessionStorage.getItem("selfCheckBomMoldCell") || "";
    $("#modalStandardMoldCell_" + index).val(cellSafe);
    $("#modalStandardMoldModel_" + index).val(task.moldModel || sessionStorage.getItem("selfCheckMoldModel") || "");
    $("#modalStandardMachineType_" + index).val(task.machineType || sessionStorage.getItem("selfCheckMachineType") || "");
    $("#modalStandardMachineModel_" + index).val(task.machineModel || sessionStorage.getItem("selfCheckMachineModel") || "");

    const pskuSafe = task.psku || "";
    const moldModelSafe = task.moldModel || sessionStorage.getItem("selfCheckMoldModel") || "";
    const machineTypeSafe = task.machineType || sessionStorage.getItem("selfCheckMachineType") || "";

    const localRes = await getBomParaDataFromLocalStorage(
      task.sku || "", pskuSafe, task.machine || "", moldModelSafe, machineModelStr, machineTypeSafe, "SelfCheck", checkNum
    );
    const contextObj = { 
      lineInputId: task.machine, 
      lineMoldType: task.moldType || sessionStorage.getItem("selfCheckBomMoldType"), 
      selfCheckNum: checkNum, 
      selfCheckDefect: task.selfCheckDefect || sessionStorage.getItem("selfCheckDefect") || "",
      pointCheckInfo: task.pointCheckInfo || sessionStorage.getItem("pointCheckInfo") || "", 
      paneIndex: index 
    };
    
    if (localRes[0] === "OK") {
      await processBomResult(localRes, contextObj);
    } else {
      showFatalError("本地数据匹配失败：" + localRes[1] + "<br><br><b>可能是后台主数据尚未配置该料号，或本地数据未同步！</b>");
    }
  }

  /** 去除数组中的重复项 */
  function delRepeatItem(arrData){
    let arrTemp = [];
    let arrNewData = [];
    for(let i = 0; i < arrData.length; i++){
      if(arrTemp.indexOf(arrData[i][0]) == -1){
        arrTemp.push(arrData[i][0]);
        arrNewData.push([arrData[i][0]]);
      }
    }
    return arrNewData;
  }

  /** 判断字符串中是否包含数组内的任一元素 */
  function checkTrue(arr, str){
    let n = 0;
    for(let i = 0; i < arr.length; i++){
      if(str.toString().indexOf(arr[i].toString()) != -1){
        n = n + 1;
      }
    }
    return n > 0;
  }

  /**
   * 汇总处理并渲染 BOM 数据及工艺参数的主干流程
   */
  async function processBomResult(result, context) {
    if (result[0] !== "OK") return swalError(result[1] || "加载失败");
    const lineInputId = context.lineInputId;
    const lineMoldType = context.lineMoldType;
    const selfCheckNum = context.selfCheckNum;
    const selfCheckDefect = context.selfCheckDefect;
    const pointCheckInfo = context.pointCheckInfo;
    const paneIndex = context.paneIndex;
    
    const arrTfBomS = result[1] || [];
    window["arrTfBomS_" + paneIndex] = arrTfBomS;

    const arrPkBom0 = result[2] || [];
    let localStdPara = result[3] || [];
    window["arrInjStdParaData_" + paneIndex] = localStdPara;
    toggleSectionsByLine(lineInputId, selfCheckNum, paneIndex);
    
    const tfRes = await selectTfBom(arrTfBomS, { lineInputId, lineMoldType, allowPopup: paneIndex === 0 });
    renderTfBomToUI(tfRes, paneIndex);
    
    if (arrPkBom0.length) handlePkBomUI({arrPkBom0, selfCheckNum, lineInputId}, paneIndex);
    
    if (localStdPara.length > 0) {
      if (window["isDuplicateMachine_" + paneIndex]) {
        $("#divParmeterInjection_" + paneIndex).hide();
        $("#divParmeterInjection_" + paneIndex).before(
          "<div class='alert alert-secondary text-center' style='margin-top:10px;'><b>" + lineInputId + "</b> 同机台多SKU，工艺参数已在前面的标签页统一核对。</div>"
        );
      } else {
        const arrMachine = lineInputId.split(",");
        GeneralInjParaCheck(arrMachine, localStdPara, paneIndex);
        const $tbodyStdPara = $("#modalTbodyStandardTechnologyID_" + paneIndex);
        $("#modalTabStandardTechnologyID_" + paneIndex + " tr:not(:first)").remove();
        localStdPara.forEach(r => {
          $tbodyStdPara.append(
            "<tr><td style='font-size:12px;text-align:center'>" + r[0] + "</td><td style='font-size:12px;text-align:center'>" + r[1] + "</td><td style='font-size:12px;text-align:center'>" + r[2] + "</td><td style='font-size:12px;text-align:center'>" + r[3] + "</td><td style='font-size:12px;text-align:center'>" + r[4] + "</td><td style='font-size:12px;text-align:center'>" + r[5] + "</td><td style='font-size:12px;text-align:center'>" + r[6] + "</td></tr>"
          );
        });
      }
    }

    let alertHtml = "";
    if(!tfRes.tfBomInputId){
      alertHtml = "<div style='color:red;'><b>没找到相应BOM，请尝试更改模具及拌料类型</b></div>";
    } else {
      if(selfCheckDefect || pointCheckInfo){
        alertHtml = "<div style='width:100%;color:red;'><marquee direction='right' scrollamount='5' behavior='alternate'><i><u>" + (selfCheckDefect || "") + "</u></i></marquee></div><div>" + General_Htmltable(judgeJSON(pointCheckInfo), 100, "PointCheckInfo") + "</div>";
      }
    }
    
    if (alertHtml) {
      $("#divMaterialInjection_" + paneIndex).before("<div class='alert alert-warning' style='margin-bottom: 10px; padding: 5px;'>" + alertHtml + "</div>");
    }
  }

  /**

   */
  async function selectTfBom(arrTfBomS, {lineInputId, lineMoldType, allowPopup = false}) {
    const autoMixMap = {
      "自动模(自动拌料)": "Y", "自动模(自动＋手工拌料)": "Y", "分步模(手工拌料)": "N", "分步模(自动拌料)": "Y"
    };
    let arrTfBom0 = [];
    if (lineInputId.startsWith("S")) {
      arrTfBom0 = arrTfBomS.filter(x => x[5] === "生效");
    } else {
      const flag = autoMixMap[lineMoldType] || "";
      if (flag) arrTfBom0 = arrTfBomS.filter(x => String(x[3]).includes(flag));
    }

    if (arrTfBom0.length === 0) return { tfBomInputId: "", tfBomUrl: "", arrTfBomSelect: [] };
    if (arrTfBom0.length === 1) return { tfBomInputId: arrTfBom0[0][0], tfBomUrl: arrTfBom0[0][7], arrTfBomSelect: arrTfBom0 };
    if (!allowPopup) {
      return { tfBomInputId: "", tfBomUrl: "", arrTfBomSelect: [] };
    }

    const objBundles = {};
    arrTfBom0.forEach(b => {
      let optionKey = "【" + b[0] + "】" + b[2]; 
      let optionText = optionKey;          
      if (b[0].toString().toUpperCase().startsWith("NPD")) {
        optionText += " 🧪 [测试BOM]"; 
      }
      objBundles[optionKey] = optionText;
    });
    
    const { value: type } = await Swal.fire({
      allowOutsideClick: false, 
      title: '检测到多个BOM', 
      input: 'select', 
      inputOptions: objBundles, 
      inputPlaceholder: '== 请务必选择适配品种 ==', 
      showCancelButton: false,
      confirmButtonText: '确定',
      inputValidator: (value) => {
        if (!value) {
          return '必须明确选择一个BOM才能继续！';
        }
      }
    });
    
    if (type) {
      const chosen = arrTfBom0.filter(v => ("【" + v[0] + "】" + v[2]) === type)[0];
      return { tfBomInputId: chosen[0], tfBomUrl: chosen[7], arrTfBomSelect: [chosen] };
    }
    
    return { tfBomInputId: "", tfBomUrl: "", arrTfBomSelect: [] };
  }

  /**
   * 离线获取 BOM 和参数数据核心逻辑
   */
  async function getBomParaDataFromLocalStorage(materialInputId, psku, lineInputId, moldModel, machineModel, machineType, checkType, checkNum){
    let arrTfMaterialData = [];
    let arrPkMaterialData = [];
    let arrSsInjParaJson = [];
    let arrSsInjPara = [];
    
    try {
      if(checkNum < 2){
        let arrJsonData = arrInjAllPlanParaData;
        let arrInjMachine = lineInputId.toString().split(",");
        let arrInjSku = materialInputId.toString().split(",");
        let arrMoldModel = moldModel.toString().split(",");
        let arrMachineModel = machineModel.toString().split(",");
        let arrMachineType = machineType.toString().split(",");
        
        for(let m = 0; m < arrInjMachine.length; m++){
          let arrInjSplitSku = arrInjSku[m].split("|");
          let arrJsonInjPara = arrJsonData.filter(function(v) {return v.模具编码 == arrMoldModel[m] && v.机型 + v.自动化分组 == arrMachineType[m] + arrMachineModel[m] && v.状态 == "生效";});
          let arrSsInjParaSku = arrJsonInjPara.filter(function(v) {return checkTrue(arrInjSplitSku, v.SKU) && v.SKU != "NA";}).map(function(v) {return v.SKU;}).join("");
          let arrSpecialSku = [];
          let specialSku = "NA";
          
          for(let i = 0; i < arrInjSplitSku.length; i++){
            let optision = arrSsInjParaSku.indexOf(arrInjSplitSku[i]);
            if(optision != -1){
              arrSpecialSku.push(arrInjSplitSku[i]);
            }
          }
          if(arrSpecialSku.length > 0) { specialSku = arrSpecialSku[0] };
          arrSsInjParaJson = arrJsonInjPara.filter(function(v) {return v.模具编码 == arrMoldModel[m] && v.机型 + v.自动化分组 == arrMachineType[m] + arrMachineModel[m] && v.SKU.toString().indexOf(specialSku) != -1 && specialSku != "" && v.状态 == "生效";});
          
          for(let i = 0; i < arrSsInjParaJson.length; i++){
            let arrParaJsonTemp = JSON.parse(arrSsInjParaJson[i]["工艺参数"]);
            for(let j = 0; j < arrParaJsonTemp.length; j++){
              if(arrParaJsonTemp[j]["检查部门"].toString().indexOf("班组") != -1 && arrParaJsonTemp[j]["设定下限"].toString() != "9999"){
                arrSsInjPara.push([arrInjMachine[m], arrSsInjParaJson[i]["分序类别"] + "【" + arrSsInjParaJson[i]["模穴数"] + "-" + arrSsInjParaJson[i]["BigBundle"] + "】", arrParaJsonTemp[j]["工艺参数"], arrParaJsonTemp[j]["单位"], arrParaJsonTemp[j]["设定下限"], arrParaJsonTemp[j]["设定上限"], arrParaJsonTemp[j]["预设值"]]);
              }
            }
          }
        }
      }
      
      let arrSsTf = arrInjAllPlanBomData[0];
      let arrSsPk = arrInjAllPlanBomData[2];
      let arrSsTfSkuAll = arrSsTf.filter(function(x){return x[4].toString().indexOf(materialInputId.toString().split(",")[0].split("|")[0]) != -1;});
      let arrSsTfSkuWaitActive = arrSsTfSkuAll.filter(function(x){return x[8] != "生效" && x[8] != "取消";}).map(function(x){return [x[0], x[1], x[2], x[3], x[7], x[8], x[10] ? moment(x[10]).format("YYYY-MM-DD") : "", x[5], x[40]];});
      let arrSsTfSku = arrSsTfSkuAll.filter(function(x){return x[8] == "生效";}).map(function(x){return [x[0], x[1], x[2], x[3], x[7], x[8], x[10] ? moment(x[10]).format("YYYY-MM-DD") : "", x[5], x[40]];});
      
      arrTfBomAll = arrSsTfSku;
      let arrSsPkSku = [];
      if(psku.toString().split(",")[0].length > 4){
        arrSsPkSku = arrSsPk.filter(function(x){return x[0].toString().indexOf(psku.toString().split(",")[0].split("|")[0]) != -1 && x[8] == "生效";}).map(function(x){return [x[2], x[3], x[1], "", x[7], x[8], x[10] ? moment(x[10]).format("YYYY-MM-DD") : "", x[5], x[4]];});
      }
      
      if(arrSsPkSku.length > 0){
        let pkWordBomId = arrSsPkSku[0][0];
        try {
          for(let m = 0; m < arrSsPkSku.length; m++){
            arrPkMaterialData = [];
            arrInjAllPlanPkBomData = await idbGet("sSArrInjAllPlanPkBomData");
            let arrPkBomDataMap = arrInjAllPlanPkBomData.map(function(x){return x[1];});
            let position = arrPkBomDataMap.indexOf(pkWordBomId);
            let arrPkSkuBom = (JSON.parse(arrInjAllPlanPkBomData[position][4]).concat(JSON.parse(arrInjAllPlanPkBomData[position][5]))).map(function(x){return x[0].toString().toUpperCase();});
            arrPkMaterialData = arrPkSkuBom.map(function(x){return [x];});
            
            let now = new Date();
            let nowHour = now.getHours();
            let shiftChar = "";
            let lineChar = "";
            
            if(nowHour >= 0 && nowHour < 8){shiftChar = "A";} else if(nowHour >= 8 && nowHour < 16){shiftChar = "B";} else if(nowHour >= 16 && nowHour <= 24){shiftChar = "C";}
            if(lineInputId.substr(1,1) == "0" || lineInputId.substr(1,1) == "1"){
              if(judgeDateCo == "Y"){ lineChar = "O"; } else { lineChar = "55"; }
            } else {
              if(judgeDateCo == "Y"){ lineChar = "I"; } else { lineChar = "58"; }
            }
            let lotNo = "";
            if(judgeDateCo == "Y"){
              lotNo = dayjs(now).format("DDMMYY") + "SX" + shiftChar + lineChar;
            } else {
              lotNo = dayjs(now).format("DDMMYY") + "X" + shiftChar + lineChar;
            }
            
            arrPkMaterialData.push([lotNo]);
            let arrPkMaterialNewData = delRepeatItem(arrPkMaterialData.filter(function(x){return x[0].toString().length > 4;}));
            arrSsPkSku[m].push(arrPkMaterialNewData);
          }
        } catch (error) {
          console.log("获取在线手包包材出错：" + error.toString());
        }
      }
      
      if(lineInputId.charAt(0) != "S"){
        let arrSsTf = arrInjAllPlanBomData[1];
        for(let m = 0; m < arrSsTfSku.length; m++){
          let tfBomId = arrSsTfSku[m][0];
          arrTfMaterialData = [];
          let arrSsTfStandard = arrSsTf.filter(function(x){return x[0] == tfBomId && materialInputId.indexOf(x[1]) > -1;});
          
          for(let i = 0; i < arrSsTfStandard.length; i++){
            if(arrSsTfStandard[i][3].toString().length < 2){
              if(checkType == "FirstCheck"){
                let arrTemp = arrSsTfStandard[i][4].toString().slice(0,13).split("/");
                for(let j = 0; j < arrTemp.length; j++){
                  arrTfMaterialData.push([arrTemp[j].toString().slice(0,6)]);
                }
              }
              arrTfMaterialData.push([arrSsTfStandard[i][5]]);
            } else {
              arrTfMaterialData.push([arrSsTfStandard[i][3]]);
            }
          }
          if(arrMachine_Type_HV_Decal.indexOf(lineInputId) != -1){
            let arrSsTfDecalData = arrInjAllPlanBomData[3];
            let arrSsTfDecalDataCol1_3 = arrSsTfDecalData.map(function(x){return x[0] + x[2];});
            let position = arrSsTfDecalDataCol1_3.indexOf(tfBomId + materialInputId);
            if(position > -1){
              arrTfMaterialData.push([arrSsTfDecalData[position][4] + "_Special"]);
            }
          }
          let arrTfMaterialNewData = delRepeatItem(arrTfMaterialData.filter(function(x){return x[0].toString().length > 4;}));
          arrSsTfSku[m].push(arrTfMaterialNewData);
        }
        return ["OK", arrSsTfSku, arrSsPkSku, arrSsInjPara];
        
      } else if(lineInputId.charAt(0) == "S" && lineInputId.slice(2,4) == "HS"){
        let arrSsTfDecalData = arrInjAllPlanBomData[3];
        let arrSsTfDecalDataCol1_3 = arrSsTfDecalData.map(function(x){return x[0] + x[2];});
        for(let m = 0; m < arrSsTfSku.length; m++){
          let tfBomId = arrSsTfSku[m][0];
          arrTfMaterialData = [];
          let position = arrSsTfDecalDataCol1_3.indexOf(tfBomId + materialInputId);
          if(position > -1){
            arrTfMaterialData.push([arrSsTfDecalData[position][4]]);
          }
          let arrTfMaterialNewData = delRepeatItem(arrTfMaterialData.filter(function(x){return x[0].toString().length > 4;}));
          arrSsTfSku[m].push(arrTfMaterialNewData);
        }
        return ["OK", arrSsTfSku, arrSsPkSku, arrSsInjPara];
        
      } else if(lineInputId.charAt(0) == "S" && lineInputId.slice(2,4) == "DP"){
        let arrSsTfPrintData = arrInjAllPlanBomData[4];
        let arrSsTfPrintDataCol1_3 = arrSsTfPrintData.map(function(x){return x[0] + x[1];});
        for(let m = 0; m < arrSsTfSku.length; m++){
          let tfBomId = arrSsTfSku[m][0];
          arrTfMaterialData = [];
          let position = arrSsTfPrintDataCol1_3.indexOf(tfBomId + materialInputId);
          let txtOilData = "";
          
          if(position > -1){
            txtOilData = arrSsTfPrintData[position][4];
            let arrTemp = txtToArr(txtOilData);
            for(let i = 0; i < arrTemp.length; i++){
              arrTfMaterialData.push([arrTemp[i][0]]);
            }
          }
          let arrTfMaterialNewData = delRepeatItem(arrTfMaterialData.filter(function(x){return x[0].toString().length > 4;}));
          arrSsTfSku[m].push(arrTfMaterialNewData);
        }
        return ["OK", arrSsTfSku, arrSsPkSku, arrSsInjPara];
      }
    } catch(e){
      console.log("getBomPara-->Error", e.toString());
      return ["NO", e.toString()];
    }
  }

  function txtToArr(txt){
    let arr = [];
    let arrRow = txt.split("\n");
    for(let i = 0; i < arrRow.length; i++){
      arr.push([]);
      let arrCol = arrRow[i].split("|");
      for(let j = 0; j < arrCol.length; j++){
        arr[i].push(arrCol[j]);
      }
    }
    return arr;
  }

  /*================== 上传图片（日期章） ==================*/
  let uploadTimers = {}; 

  function uploadPic(obj) {
    let trSeq = $(obj).closest("tr").index();
    let tabId = $(obj).closest("tbody").attr("id"); 
    let paneIndex = tabId.split("_")[1];
    let table = $("#" + tabId);
    let lineInputBoxID = $("#lineInputBoxID_" + paneIndex).val();
    window["arrScanResult_" + paneIndex] = [];

    let targetInput = table.find("tr").eq(trSeq).find("td").eq(2).find("input");
    let currentPlaceholder = targetInput.attr("placeholder") || "";
    
    if (currentPlaceholder.indexOf("上传") !== -1 || currentPlaceholder.indexOf("压缩") !== -1 || currentPlaceholder.indexOf("秒") !== -1) {
      Swal.fire({
        allowOutsideClick: false, icon: "info", title: "友情提醒", text: "有文件正在上传……请稍候！",
        showConfirmButton: true,
        footer: "<a onclick=\"clearUploadStatus('" + tabId + "', " + trSeq + ")\"><i style='color:blue;cursor:pointer'><u>清除文件</u></i></a>"
      });
      return;
    }

    let $fileInput = $("<input type='file' accept='image/*' style='display:none'>");
    $("body").append($fileInput);
    
    $fileInput.on("change", function() {
      let file = this.files[0];
      if (!file) {
        swalInfo("未选择文件……", {showConfirmButton: false, timer: 2500});
        $fileInput.remove();
        return;
      }

      showpicMessage(["INFO", "压缩中"], tabId, trSeq, paneIndex);
      let Compressor = window.Compressor;
      new Compressor(file, {
        quality: 0.5,
        success: function(result) {
          let reader = new FileReader();
          reader.onloadend = function(e) {
            showpicMessage(["INFO", "上传中"], tabId, trSeq, paneIndex);
            if (e.target.error != null) {
              swalError("文件无法被读取!");
              $fileInput.remove();
              return;
            }
            google.script.run
              .withFailureHandler(function(err) {
                judgeFailure();
                clearUploadStatus(tabId, trSeq);
                $fileInput.remove();
              })
              .withSuccessHandler(function(res) {
                showpicMessage(res, tabId, trSeq, paneIndex);
                $fileInput.remove();
              })
              .uploadpicFileToGoogleDrive(e.target.result, lineInputBoxID, "日期章");
          };
          reader.readAsDataURL(result);
        },
        error: function(err) {
          swalError("压缩图片出错:" + err.message);
          $fileInput.remove();
        }
      });
    });

    $fileInput.click();
  }

  function clearUploadStatus(tabId, trSeq) {
    if (uploadTimers[tabId]) { clearInterval(uploadTimers[tabId]); }
    let targetInput = $("#" + tabId).find("tr").eq(trSeq).find("td").eq(2).find("input");
    targetInput.val("");
    targetInput.attr("placeholder", ""); 
    Swal.close();
  }

  function showpicMessage(e, tabId, trSeq, paneIndex) {
    if (uploadTimers[tabId]) { clearInterval(uploadTimers[tabId]); }
    let targetInput = $("#" + tabId).find("tr").eq(trSeq).find("td").eq(2).find("input");
    
    if (e[0] === "INFO") {
      let startTime = 120;
      targetInput.val("");
      if (e[1] === "压缩中") {
        targetInput.attr("placeholder", "压缩中...");
      } else if (e[1] === "上传中") {
        uploadTimers[tabId] = setInterval(function() {
          targetInput.attr("placeholder", "上传中 " + startTime.toFixed(0) + "秒");
          startTime--;
          if (startTime < 0) {
            clearInterval(uploadTimers[tabId]);
            targetInput.attr("placeholder", "");
            Swal.fire({allowOutsideClick: false, icon: "info", title: "超时", text: "程序在2分钟内未响应，请重试"});
          }
        }, 1000);
      }
    } else if (e[0] === "NO") {
      targetInput.val("");
      targetInput.attr("placeholder", "");
      swalError(String(e[1]));
    } else {
      targetInput.attr("placeholder", "");
      targetInput.val(e[1]);
      window["arrScanResult_" + paneIndex] = e[2]; 
      compareDateLot(paneIndex);
    }
  }

  function compareDateLot(paneIndex) {
    let dateTime = dayjs().format("YYYY-MM-DD HH:mm:ss");
    let sapName = $("#usernameID_" + paneIndex).val();
    let machine = $("#lineInputBoxID_" + paneIndex).val();
    let sku = $("#materialInputID_" + paneIndex).val();
    let specificLotNo = $("#dateLot_" + paneIndex).val(); 
    let currentScanResult = window["arrScanResult_" + paneIndex];
    let arrData = ["上传时间：" + dateTime + "；姓名：" + sapName + "；机台：" + machine + "；SKU：" + sku];
    let scanResultTemp = "";
    
    if (currentScanResult && currentScanResult.length > 0) {
      let scanWord = currentScanResult[0].toUpperCase();
      let targetWord = specificLotNo.toUpperCase();
      let altScanWord = scanWord.replace(/(\d{6})X8(\d{2})/, function(match, p1, p2) { return p1 + "XB" + p2; });
      
      if (targetWord === scanWord || targetWord === altScanWord) {
        scanResultTemp = "相符";
      } else {
        scanResultTemp = "【<font color=\"#ff0000\">不相符</font>】";
      }
      
      let objStr = "输入：" + specificLotNo + "；扫描：" + currentScanResult[0] + "；结论：" + scanResultTemp;
      arrData.push("批号章==>" + objStr);
    }
    
    window["scanDateCompareResult_" + paneIndex] = arrData.join("<br><br>");
  }

          });

  function checkInjMaterial(materialTbodyID, selfCheckNum, lineInputId, paneIndex){
    let modalTabStandardInjMaterial = $("#modalTabStandardInjMaterialTbodyID_" + paneIndex);
    let standardInjMaterialRows = modalTabStandardInjMaterial.find("tr").length;
    let arrStandardInjMaterial = [];
    
    for(let i = 0; i < standardInjMaterialRows; i++){
      let valueTemp = modalTabStandardInjMaterial.find("tr").eq(i).find("td").eq(0).text();
      if(valueTemp !== ""){
        arrStandardInjMaterial.push(valueTemp);
      }
    }
    
    let tabActInjMaterial = $("#" + materialTbodyID);
    let actInjMaterialRows = tabActInjMaterial.find("tr").length;
    let arrActInjMaterial = [];
    let arrActInjMaterialRecord = [];
    for(let j = 0; j < actInjMaterialRows; j++){
      let valueTemp0 = tabActInjMaterial.find("tr").eq(j).find("td").eq(0).text();
      let valueTemp1 = tabActInjMaterial.find("tr").eq(j).find("td").eq(1).find("input").val();
      let valueTemp2 = tabActInjMaterial.find("tr").eq(j).find("td").eq(2).find("input").val();
      
      if(valueTemp0.toString().indexOf("物料") > -1 || valueTemp0.toString().indexOf("备用料") > -1){
        let txtTemp = "";
        if(valueTemp1.toString().length > 0 && valueTemp2.toString().length < 1){
          let splitTemp = valueTemp1.toString().indexOf("/");
          if(splitTemp == -1){
            valueTemp1 = valueTemp1.toString().substr(0, 5);
            valueTemp2 = "";
          } else {
            txtTemp = valueTemp1.toString();
            valueTemp1 = txtTemp.split("/")[0].substr(0, 5);
            valueTemp2 = txtTemp.split("/")[1];
          }
        }
        else if(valueTemp1.toString().length < 1 && valueTemp2.toString().length > 0){
          let splitTemp = valueTemp2.toString().indexOf("/");
          if(splitTemp == -1){
            valueTemp2 = valueTemp2.toString();
            valueTemp1 = "";
          } else {
            txtTemp = valueTemp2.toString();
            valueTemp1 = txtTemp.split("/")[0].substr(0, 5);
            valueTemp2 = txtTemp.split("/")[1];
          }
        }
        else if(valueTemp1.toString().length > 0 && valueTemp2.toString().length > 0){
          txtTemp = valueTemp1.toString() + "/" + valueTemp2.toString();
          valueTemp1 = txtTemp.split("/")[0].substr(0, 5);
          valueTemp2 = txtTemp.split("/")[1];
        }
      }

      // 如果当前行是“原料”，且填写了编码但没填批次，自动补齐 "NA" 绕过批次报错
      if (valueTemp0.toString().indexOf("原料") > -1 && valueTemp1.toString().length > 1 && valueTemp2.toString().trim() === "") {
          valueTemp2 = "NA";
      }
      
      if(valueTemp1.toString().length < 2 || valueTemp1.toString() == "暂不检验"){
        arrActInjMaterialRecord.push(valueTemp0, "", "");
      }
      else if(valueTemp1.toString() == "M19934"){
        arrActInjMaterialRecord.push(valueTemp0, valueTemp1, valueTemp2);
      }
      else{
        arrActInjMaterialRecord.push(valueTemp0, valueTemp1, valueTemp2);
      }
      
      if(valueTemp1 != "" && valueTemp1.length > 1 && valueTemp1 != "M19934" && valueTemp1.toString() != "暂不检验"){
        arrActInjMaterial.push([valueTemp0, valueTemp1, valueTemp2]);
      }
      if(valueTemp1 != "" && valueTemp1.length > 1 && valueTemp1 == "M19934" && valueTemp1.toString() != "暂不检验"){
        arrActInjMaterial.push([valueTemp0, valueTemp1, valueTemp2]);
      }
    }
    
    let arrErrorInjMaterial = [];
    for(let k = 0; k < arrActInjMaterial.length; k++){
      let positionTemp = arrStandardInjMaterial.indexOf(arrActInjMaterial[k][1]);
      if(positionTemp == -1){
        positionTemp = arrStandardInjMaterial.indexOf(arrActInjMaterial[k][1] + "_Special");
      }
      if(positionTemp == -1 && arrActInjMaterial[k][0].toString().indexOf("备用料") == -1){
        arrErrorInjMaterial.push([arrActInjMaterial[k][0], arrActInjMaterial[k][1], "该物料不在BOM中"]);
      }
      else {
        if(arrActInjMaterial[k][0].toString().indexOf("物料") != -1){
          let regMaterial = /^\d{4}\D{2}\d{1,2}$/;
          if(arrActInjMaterial[k][2] == ""){
            arrErrorInjMaterial.push([arrActInjMaterial[k][0], arrActInjMaterial[k][1], "该物料没有批次"]);
          }
          else if(!regMaterial.test(arrActInjMaterial[k][2].toString()) && arrActInjMaterial[k][2] != "NA"){
            arrErrorInjMaterial.push([arrActInjMaterial[k][0], arrActInjMaterial[k][1], "批次不符合要求"]);
          }
        }
        else {
          if(arrActInjMaterial[k][2] == ""){
            arrErrorInjMaterial.push([arrActInjMaterial[k][0], arrActInjMaterial[k][1], "该物料没有批次"]);
          }
          else if( ((arrActInjMaterial[k][2].toString().length < 6) && arrActInjMaterial[k][2].toString() != "NA") || (!(arrActInjMaterial[k][0].toString().indexOf("原料") != -1 || (arrActInjMaterial[k][0].toString().indexOf("色母") != -1 && arrActInjMaterial[k][1] == "M19934")) && arrActInjMaterial[k][2].toString() == "NA") ){
            arrErrorInjMaterial.push([arrActInjMaterial[k][0], arrActInjMaterial[k][1], "批次不符合要求"]);
          }
        }
      }
    }
    
    if(selfCheckNum < 2){
      let totalLength = Array.from(new Set(arrActInjMaterial.map(function(x){return x[1];}))).length;
      if(totalLength != arrStandardInjMaterial.length){
        arrErrorInjMaterial.push(["实际注塑物料数量" + totalLength, "标准注塑物料数量" + arrStandardInjMaterial.length, "数量不符"]);
      }
    }
    else{
      let arrStandardInjMaterialNew = [];
      if(arrMachine_Type_HV_Decal.indexOf(lineInputId) != -1){
        arrStandardInjMaterialNew = arrStandardInjMaterial.filter(function(x){return x.toString().indexOf("_Special") != -1 || x.toString().indexOf("M") == -1;});
      }
      else if(lineInputId.substr(2, 2) != "HS"){
        arrStandardInjMaterialNew = arrStandardInjMaterial.filter(function(x){return x.toString().indexOf("M") == -1;});
      }
      else{
        arrStandardInjMaterialNew = arrStandardInjMaterial;
      }
      
      for(let m = 0; m < arrStandardInjMaterialNew.length; m++){
        arrStandardInjMaterialNew[m] = arrStandardInjMaterialNew[m].replace("_Special", "");
      }
      
      let arrActInjMaterialNew = arrActInjMaterial.filter(function(x){return (x[0].toString().indexOf("油墨") != -1 || x[0].toString().indexOf("色母") != -1) && x[1] != "";});
      let totalLength = 0;
      
      if(Array.from(new Set(arrActInjMaterialNew.map(function(x){return x[1];}))).length + arrStandardInjMaterialNew.length > arrStandardInjMaterial.length){
        totalLength = arrStandardInjMaterial.length;
      }
      else{
        totalLength = Array.from(new Set(arrActInjMaterialNew.map(function(x){return x[1];}))).length + arrStandardInjMaterialNew.length;
      }
      
      if(Array.from(new Set(arrActInjMaterial.map(function(x){return x[1];}))).length != totalLength){
        arrErrorInjMaterial.push(["实际注塑物料数量" + Array.from(new Set(arrActInjMaterial.map(function(x){return x[1];}))).length, "标准注塑物料数量" + totalLength, "数量不符"]);
      }
    }
    return [arrErrorInjMaterial, arrActInjMaterialRecord, arrActInjMaterial];
  }

  function checkRadio(radioTableID, paneIndex){
    let tabRadio = $("#" + radioTableID);
    let tabRadioRows = tabRadio.find("tr").length;
    let arrRadioRecord = [];
    let objRadioRecord = {};
    let arrRadioName = [];
    let arrErrorRadio = [];
    let arrRadioRemind = [];
    let radioUndefinedNum = 0;
    
    let originalColCount = 0;
    if(radioTableID.indexOf("radioInjectionTableID") !== -1){
      // 【核心修复】：两小时自检没有“清场”项，必须移除 "injMaterialCleared"
      // 否则会导致数组与 HTML 行数错位，第8行的“是否已经留下样品”被当作未定义的清场项，从而误报“未选择”
      arrRadioName = ["tenacity3M","NoFracture","noColorDiff","noPlugDeformation","noFlashDefect","noDirt","noOther","keepInjSample"];
      originalColCount = 6;
    } else if(radioTableID.indexOf("radioDecalPrintTableID") !== -1){
      // 【核心修复】：同理，移除首件专属的清场项 "decalMaterialCleared"
      arrRadioName = ["tenacity3M","decalPrintPosition","noIncomplete","adhesion","noPeeling","keepDecalPrintSample"];
      originalColCount = 6;
    }
    
    for(let i = 0; i < tabRadioRows; i++){
      let inputIf = tabRadio.find("tr").eq(i).find("td").eq(0).find("input").length;
      let valueTemp = "";
      if(inputIf > 0){
        valueTemp = tabRadio.find("tr").eq(i).find("td").eq(0).find("input").val();
      } else {
        valueTemp = tabRadio.find("tr").eq(i).find("td").eq(0).text();
      }
      
      let trElem = tabRadio.find("tr").eq(i)[0];
      let trIfVisible = trElem && trElem.style.display !== "none";
      
      if(trIfVisible){
        let radioTemp = $("input[name='" + arrRadioName[i] + "_" + paneIndex + "']:checked").val();
        let $numInput = $("#" + arrRadioName[i] + "Num_" + paneIndex);
        let numTemp = $numInput.length > 0 ? $numInput.val() : "";
        
        // 【优化兼容】：增加对中文 "否" 的判断
        if(radioTemp == "No" || radioTemp == "否"){
          if(numTemp.toString().length < 1 && arrRadioName[i].indexOf("keep") == -1){
            if(valueTemp == ""){
              arrErrorRadio.push(["其它缺陷", radioTemp, "【未填写其它缺陷类别&检查不合格&未填写数量】"]);
            } else {
              arrErrorRadio.push([valueTemp, radioTemp, "【检查不合格&未填写数量】"]);
            }
          }
          else if(numTemp.toString().length > 0 && arrRadioName[i].indexOf("keep") == -1){
            if(valueTemp == ""){
              arrErrorRadio.push(["其它缺陷", radioTemp, "【未填写其它缺陷类别】"]);
            }
            arrRadioRemind.push([valueTemp + "　" + radioTemp + "　" + numTemp + "NeedRemind"]);
          }
          
          if(arrRadioName[i] == "noOther"){
            objRadioRecord["其它缺陷【" + valueTemp + "】"] = radioTemp + (numTemp ? "　" + numTemp : "");
          } else {
            objRadioRecord[valueTemp] = radioTemp + (numTemp ? "　" + numTemp : "");
          }
        }
        else if(radioTemp === undefined){
          if(arrRadioName[i] == "noOther"){
            arrErrorRadio.push(["其它缺陷", "未选择", "【未检查】"]);
          } else {
            arrErrorRadio.push([valueTemp, "未选择", "【未检查】"]);
          }
          objRadioRecord[valueTemp] = "";
          radioUndefinedNum++;
        }
        else{
          objRadioRecord[valueTemp] = radioTemp + (numTemp ? "　" + numTemp : "");
        }
      }
      else{
        objRadioRecord[valueTemp] = "不用检查";
      }
    }

    arrRadioRecord.push(JSON.stringify([objRadioRecord]));
    while(arrRadioRecord.length < originalColCount) {
       arrRadioRecord.push("");
    }

    return [arrErrorRadio, arrRadioRecord, radioUndefinedNum, arrRadioRemind];
  }

              if(col1Temp){

                }
                if(resultTemp[2].indexOf("不") != -1 && arrIotAutoFilledPara.indexOf(col1Temp) == -1){
                  arrErrorParameter.push([machine[i] + col1Temp, col3Temp, resultTemp[2]]);
                }
              }
              if(col1Temp == "周期"){
                arrKeyActStdParameter[arrKeyActStdParameter.length - 1].push([col3Temp, resultTemp[0]]);
              }
              arrActTemp[arrActTemp.length - 1].push(col1Temp, col2Temp, col3Temp);
            }
          }
          arrActParameter[arrActParameter.length - 1].push(arrActTemp);
        }
        else if(splitNumMachine != null){
          arrErrorParameter.push([machine[i], "有标准", "未选择类别"]);

        else {

        }
      }
      arrTotalParameter[arrTotalParameter.length - 1].push(arrTemp);
    }

  function checkForemanExemption(exemptionId, PasswordInputBoxID, workshop){
    let arrPassAuth = JSON.parse(localStorage.getItem("allPassAuth") || "[]");
    let arrId = arrPassAuth.map(function(x){return x[0];});
    let position = arrId.indexOf(exemptionId);
    let passAuth = [];
    
    if(position > -1){
      passAuth = [arrPassAuth[position][1], arrPassAuth[position][2], arrPassAuth[position][3], arrPassAuth[position][4]];
    }
    
    let exemptionPassReson = [];
    
    if(passAuth.length === 0 && exemptionId !== ""){
      exemptionPassReson.push(["不能跳过", "", "未找到该领班账号"]);
      return exemptionPassReson;
    }
    if(passAuth.length > 0) {
      if(passAuth[0] != PasswordInputBoxID){
        exemptionPassReson.push(["不能跳过", "", "领班密码不正确"]);
      }
      if(passAuth[2] != "INJ"){
        exemptionPassReson.push(["不能跳过", "", "不是本工序的领班"]);
      }
      if(passAuth[3] != "Y"){
        exemptionPassReson.push(["不能跳过", "", "该领班无豁免权限"]);
      }
    }
    return exemptionPassReson;
  }

  function compareArr(inputParaItem, inputParaUnit, inputParaVal, arrMachineStdPara){
    let result = ["", "", ""];
    let arrMachineStdParaItem = arrMachineStdPara.filter(function(v) { return v[2] == inputParaItem; });
    
    if(arrMachineStdParaItem.length > 0){
      if(inputParaUnit != "NA"){
        if(Number(inputParaVal) > Number(arrMachineStdParaItem[0][5]) || Number(inputParaVal) < Number(arrMachineStdParaItem[0][4])){
          result = [arrMachineStdParaItem[0][4], arrMachineStdParaItem[0][5], "不在范围：" + arrMachineStdParaItem[0][4] + "~" + arrMachineStdParaItem[0][5]];
        }
        else{
          result = [arrMachineStdParaItem[0][4], arrMachineStdParaItem[0][5], ""];
        }
      }
      else{
        if(inputParaVal != arrMachineStdParaItem[0][5] || inputParaVal != arrMachineStdParaItem[0][4]){
          result = [arrMachineStdParaItem[0][4], arrMachineStdParaItem[0][5], "与标准不符：" + arrMachineStdParaItem[0][4]];
        }
        else{
          result = [arrMachineStdParaItem[0][4], arrMachineStdParaItem[0][5], ""];
        }
      }
    }
    return result;
  }

              strTbodyCheckPara += "<tr><td style='font-size:small;text-align:center'>" + arrMachineSplitPara[j][0] + "</td><td style='font-size:small;text-align:center'>" + arrMachineSplitPara[j][1] + "</td><td style='font-size:small;text-align:center'>" + elementCol2Temp + "</td><td style='font-size:small;text-align:center'>" + arrMachineSplitPara[j][4] + "</td><td style='font-size:small;text-align:center'>" + arrMachineSplitPara[j][5] + "</td><td style='font-size:small;text-align:center'>" + elementCol5Temp + "</td><td style='font-size:small;text-align:center'>" + arrMachineSplitPara[j][8] + "</td><td style='font-size:small;text-align:center'>" + arrMachineSplitPara[j][9] + "</td><td style='font-size:small;text-align:center'>" + elementCol8Temp + "</td></tr>";
            }
            $("#parameterInjectionTbodyID_" + machine[i] + "_" + paneIndex).append(strTbodyCheckPara);
          }
        });
      }
    }
  }

  function VHDeformation2(arrSs, splitCol){
    let arrTemp = [];
    for(let i = 0; i < arrSs.length; i++){
      arrTemp.push([]);
      for(let j = 0; j < arrSs[0].length; j++){
        arrTemp[arrTemp.length - 1].push(arrSs[i][j]);
      }
    }
    let rowTotal = Math.ceil(arrTemp.length / splitCol);
    for(let n = arrTemp.length; n < rowTotal * splitCol; n++){
      arrTemp.push(["", "", "", "", ""]);
    }
    let arrData = [];
    let r = 0;
    let l = 0;
    for(let i = 0; i < rowTotal * splitCol; i++){
      if(l == 0){
        arrData.push([arrTemp[i][0], arrTemp[i][1], "", arrTemp[i][4]]);
        l = l + 1;
      }
      else{
        arrData[r].push(arrTemp[i][0], arrTemp[i][1], "", arrTemp[i][4]);
        l = l + 1;
      }
      if(l >= splitCol){
        r = r + 1;
        l = 0;
      }
    }
    return arrData;
  }

  function HVDeformation2(arrSs, splitCol){
    let arrData = [];
    for(let i = 0; i < arrSs.length; i++){
      for(let j = 0; j < arrSs[0].length; j = j + 3){
        arrData.push([arrSs[i][j + 0]]);
        for(let k = 1; k < splitCol; k++){
          arrData[arrData.length - 1].push(arrSs[i][j + k]);
        }
      }
    }
    return arrData;
  }
