<script>
  /**
   * ==========================================
   * 页面安全防护设置
   * ==========================================
   */
  window.onload = function() {       
    document.onkeydown = function() {
      let e = window.event || arguments[0];
      if (e.keyCode == 123) {         
        return false;
      } else if ((e.ctrlKey) && (e.shiftKey) && (e.keyCode == 73)) {
        return false;
      }
    }
    document.oncontextmenu = function() {
      return false;
    }
  }

  /**
   * ==========================================
   * IndexedDB 数据库封装模块
   * ==========================================
   */
  let dbPromise = null;
  function openDB() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open('cp_app_db', 1);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('kv')) {
          db.createObjectStore('kv');
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
      req.onblocked = () => console.warn('IndexedDB 升级被阻塞，可能有旧页面未关闭');
    });
    return dbPromise;
  }

  async function idbGet(key) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('kv', 'readonly');
      const req = tx.objectStore('kv').get(key);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  /**
   * ==========================================
   * 全局变量声明区
   * ==========================================
   */
  let execUrl = "";
  const timearr = [0, 0];
  window.machineStats = { totalGreen: 0, totalPink: 0, totalYellow: 0, totalGray: 0, selectedGreen: 0, selectedPink: 0, selectedYellow: 0 };
  window.tempSelectedMachines = []; 
  window.allPlanData = [];
  window.injAllPlanParaData = [];
  window.directDeliveryConfig = {}; // 存放直配 JSON 配置

  function clearDataTables() {
    $("#parameterInjectionTheadID").empty();
    $("#parameterInjectionTbodyID").empty();
    $("#modalTbodyStandardTechnologyID").empty();
    $("#selectSplitNum").hide(); 
    $("#splitNum").empty();
    $("#changeReason").text("");
  }
  
  /**扫码防抖限制**/
  $("input[name='scanInput']").on("input", function() {
    let enableScanInputIf = $("#enableScanInputIf").is(":checked");
    let limitedTime = enableScanInputIf ? 40 : 20000;
    timearr[0] = new Date().getTime();
    $("input[name='scanInput']").keydown(function() {
      timearr[1] = new Date().getTime();
      if ($(this).val().length > 1 && Math.abs(timearr[1] - timearr[0]) > limitedTime) {
        $(this).val('');
      }
    });
  });
  
  /**定时换班关闭系统**/
  function updateTimeAndTriggerAutoRefresh() {
    const handOverMorningTime = '07:45:00';
    const handOverAfternooningTime = '15:45:00';
    const handOverNightTime = '23:45:00';
    let current = moment().format('HH:mm:ss');
    if (current === handOverMorningTime || current === handOverAfternooningTime || current === handOverNightTime) {
      countClose(5000, 1000);
      setTimeout(function() { window.location.href = "about:blank"; }, 5000);
    }
  }

  function countClose(countdownTime, intervalTime) {
    let timerInterval;
    Swal.fire({
      allowOutsideClick: false, width: "80%", title: '提醒',
      html: '页在将在' + countdownTime + '秒内关闭……【 <b id="swalBox"></b> 】',
      timer: countdownTime, timerProgressBar: true,
      willOpen: () => {
        Swal.showLoading();
        timerInterval = setInterval(() => {
          const content = Swal.getContent();
          if (content) {
            const b = content.querySelector('b');
            if (b) b.textContent = parseInt(Swal.getTimerLeft() / 1000);
          }
        }, intervalTime);
      },
      willClose: () => { clearInterval(timerInterval); }
    }).then((result) => {
      if (result.dismiss === Swal.DismissReason.timer) {
        window.opener = null; window.open(' ', '_self'); window.close();
      }
    });
  }

  /**
   * ==========================================
   * 页面主加载初始化引擎 (双轨驱动版)
   * ==========================================
   */
  $(document).ready(async function () {
    google.script.run.withSuccessHandler(result => { execUrl = result; }).getReleaseWebPage();
    setInterval(updateTimeAndTriggerAutoRefresh, 1000);
    $("#workshopID").val(sessionStorage.getItem("PpmsMonthCheckWs"));
    
    Swal.fire({ 
      allowOutsideClick: false, icon: 'info', title: '数据初始化中', 
      text: "正在从本地缓存与服务器载入主数据，请稍候...", 
      showConfirmButton: false, willOpen: () => { Swal.showLoading(); } 
    });

    // 1. 同步排产计划
    window.allPlanData = JSON.parse(sessionStorage.getItem('sSAllPlan') || "[]");

    // ==========================================
    // 2. 【修复异步延迟】：直配字典的“秒开”缓存机制
    // ==========================================
    // 动作 A：网页刚打开，瞬间从本地缓存读取上一次的配置，解决手速过快导致的空白期
    let cachedDirectConfig = localStorage.getItem("localDirectDeliveryConfig");
    if (cachedDirectConfig) {
      try { 
        window.directDeliveryConfig = JSON.parse(cachedDirectConfig); 
      } catch(e) { 
        console.error("读取本地直配缓存失败", e); 
      }
    }

    // 动作 B：在后台静默发起请求拉取最新配置。拿到后更新系统变量，并覆盖本地缓存
    google.script.run.withSuccessHandler(function(configStr) {
      if (configStr) {
        try { 
          window.directDeliveryConfig = JSON.parse(configStr); 
          localStorage.setItem("localDirectDeliveryConfig", configStr); // 存入本地，下次秒开
        } catch(e) { 
          console.error("解析直配JSON失败", e); 
        }
      }
    }).getDirectDeliveryConfig();

    // 3. 读取本地工艺标准
    try {
      window.injAllPlanParaData = await idbGet('sSArrInjAllPlanParaData') || [];
      window.allMachineInfo = await idbGet('sSArrAllMachineInfo') || []; 
    } catch (e) {
      console.error("读取缓存失败", e);
    }
    
    Swal.close();

    let todayStr = moment().format("YYYY-MM-DD");
    let cachedDate = localStorage.getItem("injSelectedMachineDate");
    let cachedMachinesArray = JSON.parse(localStorage.getItem("injSelectedLinesArray") || "[]");
    
    if (cachedDate === todayStr && cachedMachinesArray.length > 0) {
      initMainCheckPage(cachedMachinesArray);
    } else {
      $("#modalMachineLayout").modal("show");
      google.script.run.withSuccessHandler(renderMachineLayout).getInjMachineLayoutAndStatus($("#workshopID").val());
    }
    
    $("#btnConfirmMachine").on("click", function() {
      if (window.tempSelectedMachines.length > 0) {
        localStorage.setItem("injSelectedLinesArray", JSON.stringify(window.tempSelectedMachines));
        localStorage.setItem("injSelectedMachineDate", todayStr);
        $("#modalMachineLayout").modal("hide");
        initMainCheckPage(window.tempSelectedMachines);
      }
    });
  });

  /**
   * ==========================================
   * 下拉框与表单级联渲染 (双轨制终极引擎)
   * ==========================================
   */
  function initMainCheckPage(machinesArray) {
    $("#usernameID").val(sessionStorage.getItem("viewName") || "");
    $("#SAPCodeID").val(sessionStorage.getItem("viewId") || "");
    $("#workshopID").val(sessionStorage.getItem("PpmsMonthCheckWs") || "");
    $("#timeInputID").val(moment().format("YYYY-MM-DD HH:mm:ss"));

    let $machineSelect = $("#lineInputBoxID");
    let $autoTypeSelect = $("#modalStandardMachineModel");
    let $skuSelect = $("#materialInputID");
    let $moldSelect = $("#modalStandardMoldModel");
    let $machineTypeInput = $("#modalStandardMachineType");

    function getMasterData() {
      let data = window.injAllPlanParaData || [];
      if (typeof data === 'string') { try { data = JSON.parse(data); } catch(e){} }
      if (!Array.isArray(data)) { data = Object.values(data); }
      return data;
    }
    
    function getCol(row, colName) { return (row && row[colName]) ? String(row[colName]).trim() : ""; }

    $machineSelect.empty().append('<option value="NONE_SELECT" selected disabled>请选择机台</option>');
    machinesArray.forEach(machine => { $machineSelect.append(`<option value="${machine}">${machine}</option>`); });
    
    $autoTypeSelect.empty().append('<option value="NONE_SELECT" selected disabled>等待机台</option>');
    $skuSelect.empty().append('<option value="NONE_SELECT" selected disabled>等待自动化</option>');
    $moldSelect.empty().append('<option value="NONE_SELECT" selected disabled>等待SKU</option>');
    $machineTypeInput.val("");
    $machineSelect.val("NONE_SELECT");

    // 交互一：【选择机台】
    $machineSelect.off("change").on("change", function() {
      let machine = $(this).val();
      if (machine === "NONE_SELECT") return;

      clearDataTables();
      $("#parameterFollowRemark").val("");

      $autoTypeSelect.empty().append('<option value="NONE_SELECT" selected disabled>请选择自动化类别</option>');
      $skuSelect.empty().append('<option value="NONE_SELECT" selected disabled>等待自动化</option>');
      $moldSelect.empty().append('<option value="NONE_SELECT" selected disabled>等待SKU</option>');

      let mType = machine.substring(2, 4); 
      $machineTypeInput.val(mType);

      let activePlan = window.allPlanData.find(row => row[4] == machine);
      
      // 双轨判定
      if (!activePlan && window.directDeliveryConfig && window.directDeliveryConfig[machine]) {
        let cfg = window.directDeliveryConfig[machine];
        let autos = cfg.autoList || ["通用 (无自动化)"];
        autos.forEach(auto => { $autoTypeSelect.append(`<option value="${auto}">${auto}</option>`); });
        if (autos.length === 1) $autoTypeSelect.val(autos[0]).trigger("change");
      } else {
        let machineMaster = window.allMachineInfo.find(row => row[0] === machine);
        let realAuto = machineMaster ? (machineMaster[1] || "").trim() : "";
        let defaultAuto = activePlan ? (activePlan[12] || "").trim() : realAuto;

        let masterParaData = getMasterData();
        let typeRecords = masterParaData.filter(row => getCol(row, "机型").toUpperCase() === mType.toUpperCase());
        let uniqueAutos = [...new Set(typeRecords.map(row => getCol(row, "自动化分组")))];

        if (realAuto && !uniqueAutos.includes(realAuto)) { uniqueAutos.push(realAuto); }
        uniqueAutos.forEach(auto => {
          let text = auto === "" ? "通用 (无自动化)" : auto;
          $autoTypeSelect.append(`<option value="${auto}">${text}</option>`);
        });

        if (defaultAuto !== null && defaultAuto !== "" && uniqueAutos.includes(defaultAuto)) {
          $autoTypeSelect.val(defaultAuto).trigger("change");
        } else if (uniqueAutos.length === 1) {
          $autoTypeSelect.val(uniqueAutos[0]).trigger("change");
        }
      }
    });

    // 交互二：【选择自动化】
    $autoTypeSelect.off("change").on("change", function() {
      let autoType = $(this).val();
      if (autoType === "NONE_SELECT") return;

      let machine = $machineSelect.val();
      let mType = $machineTypeInput.val();
      clearDataTables();

      $skuSelect.empty().append('<option value="NONE_SELECT" selected disabled>请选择物料 (SKU)</option>');
      $moldSelect.empty().append('<option value="NONE_SELECT" selected disabled>等待SKU</option>');

      let activePlan = window.allPlanData.find(row => row[4] == machine);
      let defaultSku = activePlan ? (activePlan[9] || "").trim() : null;

      if (!activePlan && window.directDeliveryConfig && window.directDeliveryConfig[machine]) {
        let cfg = window.directDeliveryConfig[machine];
        let skus = cfg.skuList || ["NA"];
        skus.forEach(sku => { $skuSelect.append(`<option value="${sku}">${sku}</option>`); });
        if (skus.length === 1) $skuSelect.val(skus[0]).trigger("change");
      } else {
        let masterParaData = getMasterData();
        let autoRecords = masterParaData.filter(row =>
          getCol(row, "机型").toUpperCase() === mType.toUpperCase() &&
          getCol(row, "自动化分组") === autoType
        );
        let uniqueSKUs = [...new Set(autoRecords.map(row => getCol(row, "SKU")).filter(Boolean))];
        if (uniqueSKUs.length === 0) { uniqueSKUs.push("NA"); }
        uniqueSKUs.forEach(sku => { $skuSelect.append(`<option value="${sku}">${sku}</option>`); });
        
        if (defaultSku !== null && uniqueSKUs.includes(defaultSku)) {
          $skuSelect.val(defaultSku).trigger("change");
        } else if (uniqueSKUs.length === 1) {
          $skuSelect.val(uniqueSKUs[0]).trigger("change");
        }
      }
    });

    // 交互三：【选择 SKU】
    $skuSelect.off("change").on("change", function() {
      let autoType = $autoTypeSelect.val();
      let sku = $(this).val();
      if (sku === "NONE_SELECT") return;

      let machine = $machineSelect.val();
      let mType = $machineTypeInput.val();
      clearDataTables();

      $moldSelect.empty().append('<option value="NONE_SELECT" selected disabled>请选择模具号</option>');

      let activePlan = window.allPlanData.find(row => row[4] == machine);
      let defaultMold = activePlan ? (activePlan[8] || "").trim().substring(0, 8) : null;

      if (!activePlan && window.directDeliveryConfig && window.directDeliveryConfig[machine]) {
        let cfg = window.directDeliveryConfig[machine];
        let molds = cfg.moldList || ["NA"];
        molds.forEach(mold => { $moldSelect.append(`<option value="${mold}">${mold}</option>`); });
        if (molds.length === 1) $moldSelect.val(molds[0]).trigger("change");
      } else {
        let masterParaData = getMasterData();
        let skuRecords = masterParaData.filter(row =>
          getCol(row, "机型").toUpperCase() === mType.toUpperCase() &&
          getCol(row, "自动化分组") === autoType &&
          getCol(row, "SKU") === sku
        );
        let uniqueMolds = [...new Set(skuRecords.map(row => getCol(row, "模具编码")).filter(Boolean))];
        if (uniqueMolds.length === 0) { uniqueMolds.push("NA"); }
        uniqueMolds.forEach(mold => { $moldSelect.append(`<option value="${mold}">${mold}</option>`); });

        if (defaultMold !== null && uniqueMolds.includes(defaultMold)) {
          $moldSelect.val(defaultMold).trigger("change");
        } else if (uniqueMolds.length === 1) {
          $moldSelect.val(uniqueMolds[0]).trigger("change");
        }
      }
    });

    // 交互四：【选择 模具】
    $moldSelect.off("change").on("change", function() {
      let machineType = $machineTypeInput.val();
      let autoType = $autoTypeSelect.val();
      let sku = $skuSelect.val();
      let mold = $(this).val();
      
      if(machineType && mold && mold !== "NONE_SELECT" && sku && sku !== "NONE_SELECT") { 
        loadMachineStandardDataLocal(machineType, autoType, mold, sku); 
      }
    });
  }

  /**
   * ==========================================
   * 核心匹配与过滤：捞取工艺卡标准数据并制表
   * ==========================================
   */
  function loadMachineStandardDataLocal(machineType, autoType, mold, sku) {
    clearDataTables();
    
    // 【拦截器】：6AX 副机判定
    let currentMachine = $("#lineInputBoxID").val();
    let currentAuto = String(autoType).trim();
    if (currentMachine && currentMachine.startsWith("V") && currentAuto.indexOf("6Aix") !== -1) {
      $("#divParmeterInjection").hide();
      $("#parameterFollowRemark").parent().parent().hide();
      
      if ($("#v-machine-alert").length === 0) {
        $("#divParmeterInjection").before(
          `<div id="v-machine-alert" class="alert alert-info text-center v-machine-pass" style="margin-top:20px;">
            <b>【${currentMachine}】</b> 属于 6Aix 副机，无需核对工艺参数，请直接点击底部 <b>[保存记录]</b> 完成巡检打卡。
          </div>`
        );
      } else {
        $("#v-machine-alert").show();
      }
      Swal.fire({allowOutsideClick:false, icon:'success', title:'副机免参数', text:'该机台为 6Aix 副机，请直接点击底部保存完成打卡！', showConfirmButton:false, timer:1500});
      return; 
    } else {
      $("#divParmeterInjection").show();
      $("#parameterFollowRemark").parent().parent().show();
      $("#v-machine-alert").hide();
    }
    
    let f_mType = String(machineType).trim().toUpperCase();
    let f_aType = String(autoType).trim().toUpperCase();
    if (f_aType === "NA") f_aType = ""; 
    let f_mold = String(mold).trim().toUpperCase();
    let f_sku = String(sku).trim().toUpperCase();
    
    let dataArray = window.injAllPlanParaData || [];
    if (typeof dataArray === 'string') {
      try { dataArray = JSON.parse(dataArray); } catch(e){}
    }
    if (!Array.isArray(dataArray)) {
      dataArray = Object.values(dataArray);
    }

    function getCol(row, index, colName) {
      if (Array.isArray(row)) return row[index];
      if (typeof row === 'object' && row !== null) return row[colName] || row[index];
      return "";
    }

    let hwRecords = dataArray.filter(row => {
        if (!row) return false;
        let r_mType = String(getCol(row, 0, "机型") || "").trim().toUpperCase();
        let r_aType = String(getCol(row, 1, "自动化分组") || "").trim().toUpperCase();
        let r_mold  = String(getCol(row, 2, "模具编码") || "").trim().toUpperCase();
        return r_mType === f_mType && r_aType === f_aType && r_mold === f_mold;
    });
    let matchLevel = "专有自动化";
    
    if (hwRecords.length === 0) {
        hwRecords = dataArray.filter(row => {
            if (!row) return false;
            let r_mType = String(getCol(row, 0, "机型") || "").trim().toUpperCase();
            let r_aType = String(getCol(row, 1, "自动化分组") || "").trim().toUpperCase();
            let r_mold  = String(getCol(row, 2, "模具编码") || "").trim().toUpperCase();
            return r_mType === f_mType && (r_aType === "" || r_aType === "NA") && r_mold === f_mold;
        });
        matchLevel = "通用自动化(无)";
    }

    if (hwRecords.length === 0) {
      Swal.fire({allowOutsideClick:false, icon:'warning', title:'无硬件匹配', html:`找不到硬件组合: 机型:<b>${f_mType}</b>, 自动化:<b>${f_aType||"无"}</b>, 模具:<b>${f_mold}</b> 的数据！`, showConfirmButton:true});
      return;
    }

    let finalRecords = hwRecords.filter(row => {
        let r_sku = String(getCol(row, 4, "SKU") || "").trim().toUpperCase();
        return r_sku === f_sku;
    });
    matchLevel += " + 精确物料";

    if (finalRecords.length === 0 && f_sku !== "NA") {
        finalRecords = hwRecords.filter(row => {
            let r_sku = String(getCol(row, 4, "SKU") || "").trim().toUpperCase();
            return r_sku === "NA";
        });
        matchLevel = matchLevel.replace("精确物料", "NA通用物料");
    }

    if (finalRecords.length === 0) {
      Swal.fire({allowOutsideClick:false, icon:'warning', title:'无物料匹配', html:`在当前硬件下，找不到 SKU: <b>${f_sku}</b> (或 NA) 的工艺卡！`, showConfirmButton:true});
      return;
    }

    let arrInjStdParaData = [];
    let seenParams = new Set(); 

    finalRecords.forEach(targetRow => {
        let splitOrder = String(getCol(targetRow, 7, "分序类别") || "").trim(); 
        let cavity = String(getCol(targetRow, 6, "模穴") || "").trim();         
        let bigBundle = String(getCol(targetRow, 3, "BigBundle") || "").trim(); 
        let splitStr = `${splitOrder}【${cavity}-${bigBundle}】`;
        
        let jsonStr = getCol(targetRow, 8, "工艺参数") || "[]";   
              
        try {
            let paramsList = JSON.parse(jsonStr);
            if (!Array.isArray(paramsList)) paramsList = [paramsList];
            
            let deviceParams = paramsList.filter(p => {
                let dept = String(p["检查部门"] || "");
                return dept.includes("设备");
            });
            
            deviceParams.forEach(p => {
                let pName = p["工艺参数"] || p["参数"] || "";
                let paramKey = splitStr + "_|_" + pName; 
                
                if (!seenParams.has(paramKey)) {
                    seenParams.add(paramKey);
                    arrInjStdParaData.push([
                        splitStr, pName, p["单位"] || "", 
                        p["设定下限"] || p["下限"] || "", p["设定上限"] || p["上限"] || "", 
                        p["默认值"] || p["设定标准"] || p["标准值"] || "", p["变更原因"] || ""
                    ]);
                }
            });
        } catch(e) {
            console.error("解析工艺参数JSON失败:", jsonStr, e);
        }
    });

    if (arrInjStdParaData.length === 0) {
        Swal.fire({icon:'warning', title:'无检查项', text:'已加载工艺卡，但该工艺卡内没有检查部门包含“设备”的参数项。'});
        return;
    }

    sessionStorage.setItem("sessionStorageInjStdParaData", JSON.stringify(arrInjStdParaData));
    
    let tbodyStdPara = $("#modalTbodyStandardTechnologyID");
    tbodyStdPara.empty();
    for(let k = 0; k < arrInjStdParaData.length; k++){
      tbodyStdPara.append("<tr><td style='font-size:12px;text-align:center'>" + arrInjStdParaData[k][0] + "</td><td style='font-size:12px;text-align:center'>" + arrInjStdParaData[k][1] + "</td><td style='font-size:12px;text-align:center'>" + arrInjStdParaData[k][2] + "</td><td style='font-size:12px;text-align:center'>" + arrInjStdParaData[k][3] + "</td><td style='font-size:12px;text-align:center'>" + arrInjStdParaData[k][4] + "</td></tr>");
    }

    let arrMoldSplit = Array.from(new Set(arrInjStdParaData.map(x => x[0])));
    let $splitNumSelect = $("#splitNum");
    let $selectSplitNumContainer = $("#selectSplitNum");

    $splitNumSelect.off("change");

    if (arrMoldSplit.length < 2) {
      $selectSplitNumContainer.hide();
      renderInputTable(arrInjStdParaData);
      Swal.fire({allowOutsideClick:false, icon:'success', title:'加载成功', text:`匹配层级：${matchLevel}`, showConfirmButton:false, timer:1500});
    } else {
      $("#parameterInjectionTheadID").empty();
      $("#parameterInjectionTbodyID").empty(); 
      $("#changeReason").text("");
      
      $selectSplitNumContainer.show(); 
      $splitNumSelect.empty().show();
      $splitNumSelect.append("<option style='font-size:small' value='' selected disabled>请选择分步数...</option>");
      arrMoldSplit.forEach(split => {
        $splitNumSelect.append("<option style='font-size:small' value='" + split + "'>" + split + "</option>");
      });
      $splitNumSelect.on("change", function() {
        let selectedSplit = $(this).val();
        let filteredParaData = arrInjStdParaData.filter(x => x[0] === selectedSplit);
        renderInputTable(filteredParaData); 
      });
      Swal.fire({allowOutsideClick:false, icon:'success', title:'请选择分步数', text:`匹配层级：${matchLevel}。(存在多段分步，请在左侧下拉选择)`, showConfirmButton:true});
    }
  }

  function renderInputTable(paraDataArray) {
    let theadPara = $("#parameterInjectionTheadID");
    let tbodyPara = $("#parameterInjectionTbodyID");
    theadPara.empty();
    tbodyPara.empty();

    if (!paraDataArray || paraDataArray.length === 0) return;
    
    if (paraDataArray[0][6]) {
      $("#changeReason").text("此标准工艺有变更原因【" + paraDataArray[0][6] + "】");
    } else {
      $("#changeReason").text("");
    }

  function checkInjParameter(parameterTbodyID) {
    let modalTbodyStdParaData = $("#modalTbodyStandardTechnologyID");
    let stdParaDataRows = modalTbodyStdParaData.find("tr").length;
    let arrStdParaData = [];
    let splitNum = $("#splitNum").val();
    
    if (splitNum == null) {
      for (let i = 0; i < stdParaDataRows; i++) {
        let valueDes = modalTbodyStdParaData.find("tr").eq(i).find("td").eq(1).text();
        let valueMin = modalTbodyStdParaData.find("tr").eq(i).find("td").eq(3).text();
        let valueMax = modalTbodyStdParaData.find("tr").eq(i).find("td").eq(4).text();
        if (valueDes != "") {
          arrStdParaData.push([valueDes, valueMin, valueMax]);
        }
      }
    } else {
      for (let i = 0; i < stdParaDataRows; i++) {
        let valueSplit = modalTbodyStdParaData.find("tr").eq(i).find("td").eq(0).text();
        let valueDes = modalTbodyStdParaData.find("tr").eq(i).find("td").eq(1).text();
        let valueMin = modalTbodyStdParaData.find("tr").eq(i).find("td").eq(3).text();
        let valueMax = modalTbodyStdParaData.find("tr").eq(i).find("td").eq(4).text();
        if (valueDes != "" && valueSplit == splitNum) {
          arrStdParaData.push([valueDes, valueMin, valueMax]);
        }
      }
    }
    
    let arrStdParaDes = arrStdParaData.map(function(x) { return x[0]; });
    let tbodyParameter = $("#" + parameterTbodyID);
    let tbodyParameterRows = tbodyParameter.find("tr").length;
    let tbodyParameterCols = tbodyParameter.find("tr").eq(0).find("td").length;
    let arrActParameterRecord = [];
    let arrActParameter = [];
    let arrErrorParameter = [];
    
    for (let i = 0; i < tbodyParameterRows; i++) {
      arrActParameterRecord = [];
      for (let j = 0; j < tbodyParameterCols; j++) {
        let valueTemp = tbodyParameter.find("tr").eq(i).find("td").eq(j).children().val();
        arrActParameterRecord.push(valueTemp);
      }
      arrActParameter.push(arrActParameterRecord);
    }
    
    let arrActParameterTemp = HVDeformation2(arrActParameter, 3);
    let arrActParameterNew = arrActParameterTemp.filter(function(x) { return x[0] != ""; });
    
    for (let i = 0; i < arrActParameterNew.length; i++) {
      let position = arrStdParaDes.indexOf(arrActParameterNew[i][0]);
      let valueMin = arrStdParaData[position][1];
      let valueMax = arrStdParaData[position][2];
      
      if (arrActParameterNew[i][1] != "NA") {
        let valueTemp = arrActParameterNew[i][2];
        if (Number(valueTemp) < Number(valueMin) || Number(valueTemp) > Number(valueMax)) {
          arrErrorParameter.push([arrActParameterNew[i][0], valueTemp, "不在范围[标准：" + valueMin + "~" + valueMax + "]"]);
        }
      } else {
        let valueTemp = arrActParameterNew[i][2];
        if (valueTemp != valueMin && valueTemp != valueMax) {
          arrErrorParameter.push([arrActParameterNew[i][0], valueTemp, "与标准不符[标准：" + valueMin + "]"]);
        }
      }
    }
    
    let strParameterRecord = JSON.stringify(arrActParameter);
    return [arrErrorParameter, strParameterRecord, arrActParameter];
  }

  function General_Htmltable(data, scale) {
    let arrWidths = [45, 30, 25];
    let htmltable = "<table border='1' style='table-layout:fixed;border-collapse:separate;font-size:small;color:red;width:" + scale + "%;'>";
    for (let i = 0; i < data.length; i++) {
      htmltable += "<tr>";
      for (let j = 0; j < data[i].length; j++) {
        if (i == 0) {
          htmltable += "<td style=';text-align:center;background-color:#CCFFFF;color:black;font-weight:bold;width:" + arrWidths[j] + "%'>" + data[i][j] + "</td>";
        } else if (i > 0 && i % 2 == 0) {
          htmltable += "<td style=';text-align:center;background-color:#E8E8E8'>" + data[i][j] + "</td>";
        } else {
          htmltable += "<td style=';text-align:center'>" + data[i][j] + "</td>";
        }
      }
      htmltable += "</tr>";
    }
    return htmltable + "</table>";
  }

  function VHDeformation2(arrSs, splitCol) {
    let arrTemp = [];
    for (let i = 0; i < arrSs.length; i++) {
      arrTemp.push([]);
      for (let j = 0; j < arrSs[0].length; j++) {
        arrTemp[arrTemp.length - 1].push(arrSs[i][j]);
      }
    }
    let rowTotal = Math.ceil(arrTemp.length / splitCol);
    let arrData = [];
    if (arrTemp.length < 4) {
      let r = 0, l = 0;
      rowTotal = 1;
      for (let i = 0; i < arrTemp.length; i++) {
        if (l == 0) {
          arrData.push([arrTemp[i][0], arrTemp[i][1], "", arrTemp[i][4]]);
          r++;
        } else {
          arrData[r].push(arrTemp[i][0], arrTemp[i][1], "", arrTemp[i][4]);
        }
        if (r >= rowTotal) { r = 0; l++; }
      }
    } else {
      for (let n = arrTemp.length; n < rowTotal * splitCol; n++) {
        arrTemp.push(["", "", ""]);
      }
      let r = 0, l = 0;
      for (let i = 0; i < rowTotal * splitCol; i++) {
        if (l == 0) {
          arrData.push([arrTemp[i][0], arrTemp[i][1], "", arrTemp[i][4]]);
          l++;
        } else {
          arrData[r].push(arrTemp[i][0], arrTemp[i][1], "", arrTemp[i][4]);
          l++;
        }
        if (l >= splitCol) { r++; l = 0; }
      }
    }
    return arrData;
  }

  function HVDeformation2(arrSs, splitCol) {
    let arrData = [];
    for (let i = 0; i < arrSs.length; i++) {
      for (let j = 0; j < arrSs[0].length; j = j + 3) {
        arrData.push([arrSs[i][j + 0]]);
        for (let k = 1; k < splitCol; k++) {
          arrData[arrData.length - 1].push(arrSs[i][j + k]);
        }
      }
    }
    return arrData;
  }

  function getRandomTwoNum(m, n) {
    let result = m;
    if (!isNaN(m) && !isNaN(n)) {
      if (m.indexOf(".") != -1 || n.indexOf(".") != -1) {
        result = Math.floor((Math.random() * (Number(n) - Number(m)) + Number(m)) * 10) / 10;
      } else {
        result = Math.floor(Math.random() * (Number(n) - Number(m)) + Number(m));
      }
    }
    return result;
  }

  /**
   * 机台物理布局与月检四色状态渲染
   */
  function renderMachineLayout(result) {
    let layout = result.layout;
    let monthCheckedGray = result.monthCheckedGray || [];
    let injChecked24h = result.injChecked24h || [];
    let injChecked168h = result.injChecked168h || [];
    
    window.machineStats = { totalGreen: 0, totalPink: 0, totalYellow: 0, totalGray: 0, selectedGreen: 0, selectedPink: 0, selectedYellow: 0 };
    let html = "<table class='table table-bordered table-sm' style='table-layout: fixed; width: 100%; font-size: 12px;'><tbody>";
    
    for (let r = 0; r < layout.length; r++) {
      html += "<tr>";
      for (let c = 0; c < layout[r].length; c++) {
        let cellValue = layout[r][c] ? layout[r][c].toString().trim() : "";
        if (cellValue.length === 8 && (cellValue.startsWith("T") || cellValue.startsWith("H") || cellValue.startsWith("V") || cellValue.startsWith("E") || cellValue.startsWith("S"))) {
          
          let btnClass = "", btnDisabled = "", colorType = "", customStyle = "font-weight:bold; height:100%;";
          
          if (monthCheckedGray.includes(cellValue)) {
            btnClass = "btn-secondary";
            btnDisabled = "disabled";
            colorType = "gray";
            window.machineStats.totalGray++;
          } else if (injChecked24h.includes(cellValue)) {
            btnClass = "btn-success";
            colorType = "green";
            window.machineStats.totalGreen++;
          } else if (injChecked168h.includes(cellValue)) {
            btnClass = "btn-danger";
            colorType = "pink"; 
            customStyle += " background-color: pink; color: #850038; border-color: hotpink;";
            window.machineStats.totalPink++;
          } else {
            btnClass = "btn-warning";
            colorType = "yellow";
            window.machineStats.totalYellow++;
          }
          
          html += `<td class='text-center align-middle' style='padding:5px;'>
                    <button class='btn btn-sm btn-block machine-btn ${btnClass}' ${btnDisabled} data-machine='${cellValue}' data-color='${colorType}' style='${customStyle}'>
                      ${cellValue}
                    </button>
                  </td>`;
        } else {
          html += `<td class='text-center align-middle bg-light'>${cellValue}</td>`;
        }
      }
      html += "</tr>";
    }
    html += "</tbody></table>";
    
    $("#layoutContainer").html(html);
    updateMachineStatsUI();
    
    $(".machine-btn:not(.disabled)").off("click").on("click", function() {
      let machineId = $(this).data("machine");
      let mColor = $(this).data("color");
      
      if ($(this).hasClass("selected-machine")) {
        $(this).removeClass("selected-machine").css("border", "");
        if (mColor === "pink") $(this).css("border-color", "hotpink"); 
        window.tempSelectedMachines = window.tempSelectedMachines.filter(m => m !== machineId);
        if (mColor === "green") window.machineStats.selectedGreen--;
        if (mColor === "pink") window.machineStats.selectedPink--;
        if (mColor === "yellow") window.machineStats.selectedYellow--;
      } else {
        $(this).addClass("selected-machine").css("border", "3px solid black");
        window.tempSelectedMachines.push(machineId);
        if (mColor === "green") window.machineStats.selectedGreen++;
        if (mColor === "pink") window.machineStats.selectedPink++;
        if (mColor === "yellow") window.machineStats.selectedYellow++;
      }
      
      updateMachineStatsUI();
      if (window.tempSelectedMachines.length > 0) {
        $("#selectedMachineText").text("已选择机台: " + window.tempSelectedMachines.join(", "));
        $("#btnConfirmMachine").prop("disabled", false);
      } else {
        $("#selectedMachineText").text("未选择机台");
        $("#btnConfirmMachine").prop("disabled", true);
      }
    });
  }

  function updateMachineStatsUI() {
    let s = window.machineStats;
    let greenRatio = s.totalGreen === 0 ? 0 : Math.round((s.selectedGreen / s.totalGreen) * 100);
    $("#statGreen").text(`${s.selectedGreen} / ${s.totalGreen} (${greenRatio}%)`);
    let pinkRatio = s.totalPink === 0 ? 0 : Math.round((s.selectedPink / s.totalPink) * 100);
    $("#statPink").text(`${s.selectedPink} / ${s.totalPink} (${pinkRatio}%)`);
    let yellowRatio = s.totalYellow === 0 ? 0 : Math.round((s.selectedYellow / s.totalYellow) * 100);
    $("#statYellow").text(`${s.selectedYellow} / ${s.totalYellow} (${yellowRatio}%)`);
    let overallTotal = s.totalGreen + s.totalPink + s.totalYellow + s.totalGray;
    let overallCompleted = s.selectedGreen + s.selectedPink + s.selectedYellow + s.totalGray;
    let overallRatio = overallTotal === 0 ? 0 : Math.round((overallCompleted / overallTotal) * 100);
    $("#statTotal").text(`${overallCompleted} / ${overallTotal} (${overallRatio}%)`);
  }

  /**
   * 双击清除缓存标签强制释放选中的机台记忆
   */
  $("#clearStorage").on("dblclick", function() {
    localStorage.removeItem("injSelectedLinesArray");
    localStorage.removeItem("injSelectedMachineDate");
    Swal.fire({allowOutsideClick:false, icon:'info', title:'提醒', text:"缓存已清除", showConfirmButton:false, timer:1500});
  });

</script>
