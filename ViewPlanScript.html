  /**
   * 时间窗计算器：计算出静态数据下一次失效的绝对时间戳
   * @returns {number} expireDate.getTime() - 返回下一次数据失效的毫秒级时间戳
   */
  function getNextExpireTime() {
    const now = new Date();
    const currentHours = now.getHours();
    const currentMinutes = now.getMinutes();
    const currentTotalMinutes = currentHours * 60 + currentMinutes;

    // 换班与计划更新断点 (分钟)：07:45, 14:45, 15:45, 23:45
    const breakpoints = [465, 885, 945, 1425];
    let nextBP = null;

    for (let i = 0; i < breakpoints.length; i++) {
      if (currentTotalMinutes < breakpoints[i]) {
        nextBP = breakpoints[i];
        break;
      }
    }

    let expireDate = new Date(now.getTime());
    if (nextBP === null) { 
      // 超过 23:45，下一个断点是明天的 07:45
      expireDate.setDate(expireDate.getDate() + 1);
      expireDate.setHours(7, 45, 0, 0);
    } else {
      // 在当天的某个断点
      expireDate.setHours(Math.floor(nextBP / 60), nextBP % 60, 0, 0);
    }
    return expireDate.getTime();
  }

  /**
   * 智能请求分发器：拦截 F5 刷新，附带缓存自愈机制
   * 如果缓存有效则请求动态数据，否则请求全量数据
   */
  async function smartFetchPlanAndBom() {
    const expireTime = localStorage.getItem("staticDataExpireTime");
    const currentTime = new Date().getTime();
    let needFullFetch = true;

    // 验证保质期，并且【强制检查】关键缓存是否为空（修复缓存被误杀的问题）
    if (expireTime && currentTime < parseInt(expireTime)) {
      const cachedBom = await idbGet("sSArrInjAllPlanBomData");
      const cachedMachine = await idbGet("sSArrAllMachineInfo");
      // 只有在缓存完好、有数据且未过期时，才阻断全量请求！
      if (cachedBom && cachedBom.length > 0 && cachedMachine && cachedMachine.length > 0) {
        needFullFetch = false;
      }
    }

    if (needFullFetch) {
      console.log("🟢 发起【全量巨无霸】请求...");
      swalInfo("正在拉取最新排产与主数据...", { footer: '<p style="color:red">数据量较大，请耐心等待</p>' });
      google.script.run.withFailureHandler(err => swalError("请求失败：" + err.message)).withSuccessHandler(handleFullData).getAllPlan();
    } else {
      console.log("⚡ 发起【极速动态】请求...");
      swalInfo("正在同步实时生产状态...", { footer: '<p style="color:green">静态缓存有效，正在极速对齐</p>' });
      google.script.run.withFailureHandler(err => swalError("请求失败：" + err.message)).withSuccessHandler(handleDynamicData).getDynamicPlanOnly();
    }
  }

  }

  async function requestWakeLock() {

      btnWake.innerHTML = "🔌";

      judgeBright = false;
    }
    document.addEventListener('visibilitychange', handleVisibilityChange);
  }

  /**
   * 释放屏幕常亮锁定
   */
  async function releaseWakeLock() {
    if (wakeLock) {
      try {
        await wakeLock.release();
      } catch (e) {}
      wakeLock = null;
    }
    btnWake.innerHTML = "🔌";
    showMyToast("屏幕常亮已停用");
    judgeBright = false;

  /**
   * 打开或创建 IndexedDB 数据库
   * @returns {Promise<IDBDatabase>} 返回数据库实例
   */
  function openDB() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open('cp_app_db', 1);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('kv')) {
          db.createObjectStore('kv');
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
      req.onblocked = () => console.warn('IndexedDB 升级被阻塞，可能有旧页面未关闭');
    });
    return dbPromise;
  }

  /**
   * 将数据存入 IndexedDB
   * @param {string} key - 存储键
   * @param {any} value - 存储值
   * @returns {Promise<boolean>}
   */
  async function idbSet(key, value) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('kv', 'readwrite');
      tx.objectStore('kv').put(value, key);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
    });
  }

  /**
   * 从 IndexedDB 获取数据
   * @param {string} key - 存储键
   * @returns {Promise<any>}
   */
  async function idbGet(key) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('kv', 'readonly');
      const req = tx.objectStore('kv').get(key);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  /**
   * 批量将数据存入 IndexedDB
   * @param {Array} pairs - 形如 [[key, value], [key2, value2]] 的数组
   * @returns {Promise<boolean>}
   */
  async function idbSetMany(pairs) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('kv', 'readwrite');
      const store = tx.objectStore('kv');
      for (const [k, v] of pairs) store.put(v, k);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
    });
  }

  /**
   * 获取当前逻辑班次标识 (用于校验两小时自检缓存是否跨班次)
   * @returns {string} 例如 "2026-05-16_早"
   */
  function getCurrentLogicalShift() {
    let now = new Date();
    let nowHM = dayjs(now).format("HH:mm");
    let tDate = dayjs(now).format("YYYY-MM-DD");
    let nDate = dayjs(now.getTime() + 86400000).format("YYYY-MM-DD");
    if (nowHM > "23:44" && nowHM <= "23:59") return nDate + "_夜";
    if (nowHM >= "00:00" && nowHM < "07:45") return tDate + "_夜";
    if (nowHM >= "07:45" && nowHM < "15:45") return tDate + "_早";
    return tDate + "_中";
  }

  /*============点击【两小时自检】按钮后弹出检查类别============*/
  $("#btnSelfCheck").off("click").on("click", async function() {
    const trSeq = $("#teamCheckTypeRow").val();
    const tbody = $("#tbodydisplay");
    const mainMachine = tbody.find("tr").eq(trSeq).find("td").eq(4).text().substring(0, 8);

    window.tempCheckQueue = []; 
    window.currentActionType = "SelfCheck"; 

    // 1. 尝试读取本地自检记忆缓存
    let cacheStr = localStorage.getItem("lastSelfCheckCache");
    let useCacheDirectly = false;
    let loadCacheToMap = false;

    if (cacheStr) {
      try {
        let cacheData = JSON.parse(cacheStr);
        let currentShift = getCurrentLogicalShift();
        
        // 防呆1：检查是否为同班次 (跨班次则缓存失效)
        if (cacheData.shiftKey === currentShift && cacheData.tasks && cacheData.tasks.length > 0) {
          let allPlans = JSON.parse(sessionStorage.getItem("sSAllPlan") || "[]");
          let allValid = true;
          
          // 防呆2：拿着缓存去活的排产计划(sSAllPlan)里查岗，机台停机或SKU不存在则验证失败！
          for (let i = 0; i < cacheData.tasks.length; i++) {
            let task = cacheData.tasks[i];
            let m = task.machine.substring(0, 8);
            let sku = task.sku;
            let found = allPlans.some(p => p[4] && p[4].toString().substring(0,8) === m && p[9] && p[9].toString().trim() === sku);
            if (!found) {
              allValid = false;
              break; 
            }
          }

          if (allValid) {
            // 拼装高颜值的任务列表 HTML
            let taskListHtml = "";
            for (let i = 0; i < cacheData.tasks.length; i++) {
              taskListHtml += "<div style='text-align:left; padding:4px 20px; font-size:14px; color:#333;'>🟢 <b>" + cacheData.tasks[i].machine + "</b> - " + cacheData.tasks[i].sku + "</div>";
            }
            let swalHtml = "<div style='font-size:14px; margin-bottom:10px; font-weight:bold; color:#d33;'>是否需要变更机台与SKU？</div>" + 
                           "<div style='background:#f8f9fa; border-radius:5px; padding:10px; margin-bottom:10px; border:1px solid #dee2e6;'>" + taskListHtml + "</div>";
            
            // 弹出询问框
            let res = await Swal.fire({
              title: "发现上次自检记录",
              html: swalHtml,
              icon: "question",
              showCancelButton: true,
              confirmButtonColor: "#28a745",
              cancelButtonColor: "#6c757d",
              confirmButtonText: "不需要 (直接进入)",
              cancelButtonText: "需要 (变更勾选)",
              allowOutsideClick: false
            });

            if (res.isConfirmed) {
              useCacheDirectly = true;
            } else {
              // 用户点击“需要修改”，把缓存塞进队列，准备让地图回显
              loadCacheToMap = true;
              window.tempCheckQueue = cacheData.tasks;
            }
          }
        }
      } catch(e) { console.error("自检缓存读取失败", e); }
    }

    // 分流处理
    if (useCacheDirectly) {
      // 一键起飞，直接进自检单
      sessionStorage.setItem("multiTaskQueue", JSON.stringify(window.tempCheckQueue.length > 0 ? window.tempCheckQueue : JSON.parse(cacheStr).tasks));
      window.open(execUrl + "?v=SelfCheck");
      $("#modalTeamCheckType").modal("hide");
      return; 
    }

    // 正常弹出布局图（若有 loadCacheToMap = true，它会被回显为绿色）
    openLayoutPicker(mainMachine);
    $("#modalTeamCheckType").modal("hide");
  });

  /**
   * 渲染布局图并处理点击拾取逻辑
   * @param {string} mainMachine - 主控机台号
   */
  async function openLayoutPicker(mainMachine) {
    // 根据主控机台的第2个字符动态判断车间
    let workshop = "TB1";
    if (mainMachine && mainMachine.charAt(1) === '2') {
      workshop = "TB2";
    }
    sessionStorage.setItem("selfCheckDep", workshop);

    // 从缓存读取布局
    let layoutData = await idbGet('sSLayoutMap_' + workshop);
    
    // 如果缓存没有（首次加载），则显示加载动画并向后台请求
    if (!layoutData) {
      Swal.fire({
        title: `首次加载 ${workshop} 车间布局...`,
        text: '正在从服务器获取地图，请稍候',
        allowOutsideClick: false,
        didOpen: () => Swal.showLoading()
      });

      try {
        // 使用 Promise 将异步变同步，阻塞等待地图数据返回
        const res = await new Promise((resolve, reject) => {
          google.script.run
            .withFailureHandler(err => reject(err))
            .withSuccessHandler(res => resolve(res))
            .getPureInjLayout(workshop);
        });

        if (res[0] === "OK") {
          layoutData = res[1];
          await idbSet('sSLayoutMap_' + workshop, layoutData);
          Swal.close(); // 数据拉取成功，关闭加载动画
        } else {
          throw new Error(res[1]);
        }
      } catch (error) {
        Swal.fire({icon: 'error', title: '布局加载失败', text: error.message});
        return; // 加载失败，直接终止
      }
    }

    // 只有在确定拿到了数据之后，才渲染并弹出框
    renderLayoutGrid(layoutData, mainMachine);
    $("#modalLayoutPicker").modal("show");

    // ==========================================
    // 【新增体验优化：自动平滑滚动定位到主控机台】
    // ==========================================
    if (mainMachine) {
      // 延迟 300 毫秒，等待 Bootstrap 模态框的淡入动画（fade）完全展开
      // 如果不等动画结束就滚动，获取到的元素坐标会是错的
      setTimeout(() => {
        const $targetCell = $(`#layoutContainer td[data-machine='${mainMachine}']`);
        if ($targetCell.length > 0) {
          // 调用浏览器原生滚动 API，behavior: 'smooth' 带来丝滑动画，block: 'center' 让它居中显示
          $targetCell[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }, 300);
    }
  }

  /**
   * 渲染车间布局图网格
   * @param {Array} grid - 布局二维数组
   * @param {string} mainMachine - 主控机台
   */
  function renderLayoutGrid(grid, mainMachine) {
    const $container = $("#layoutContainer");
    $container.empty();

    const allPlans = JSON.parse(sessionStorage.getItem("sSAllPlan") || "[]");
    const activeMachines = [...new Set(allPlans.map(p => p[4] && p[4].toString().substring(0,8)))];
    let tableHtml = '<table class="table-bordered text-center layout-table" style="width:100%; table-layout:fixed; font-size:12px;"><tbody>';
    
    grid.forEach(row => {
      tableHtml += '<tr>';
      row.forEach(cellValue => {
        let machineName = cellValue ? cellValue.toString().trim() : "";
        let cellClass = "";
        let cellStyle = "height: 45px; vertical-align: middle; padding: 2px; word-wrap: break-word;";

        if (!machineName) {
          cellClass = "bg-light";
        } else if (activeMachines.includes(machineName) || machineName === mainMachine) {
          cellClass = "bg-primary text-white machine-cell cell-selectable";
          cellStyle += " cursor: pointer;";
        } else {
          cellClass = "bg-secondary text-white";
        }

        tableHtml += '<td class="' + cellClass + '" style="' + cellStyle + '" data-machine="' + machineName + '">' + machineName + '</td>';
      });
      tableHtml += '</tr>';
    });

    tableHtml += '</tbody></table>';
    $container.append(tableHtml);

    // 机台点击事件分流
    $container.find(".cell-selectable").on("click", function() {
      const $cell = $(this);
      const clickedMachine = $cell.data("machine");
      
      // 核心交互：如果是绿色，点击则取消变蓝
      if ($cell.hasClass("cell-selected")) {
        $cell.removeClass("bg-success font-weight-bold cell-selected").addClass("bg-primary");
        $cell.css("box-shadow", "none");
        window.tempCheckQueue = window.tempCheckQueue.filter(task => task.machine !== clickedMachine);
        updateTaskCount();
        return;
      }
    
      // 如果是蓝色，点击则分流选SKU
      if (window.currentActionType === "HandOver") {
        window.tempCheckQueue.push({ machine: clickedMachine });
        $cell.removeClass("bg-primary").addClass("bg-success font-weight-bold cell-selected");
        $cell.css("box-shadow", "inset 0 0 5px rgba(0,0,0,0.5)");
        updateTaskCount();
      } else {
        showPlanPicker(clickedMachine, $cell, allPlans);
      }
    });

    // ==========================================
    // 【新增核心】：回显 window.tempCheckQueue 里已有的机台(变绿)
    // ==========================================
    if (window.tempCheckQueue && window.tempCheckQueue.length > 0) {
      window.tempCheckQueue.forEach(task => {
        let m = task.machine.substring(0, 8);
        let $c = $container.find("td[data-machine='" + m + "']");
        if ($c.length > 0 && !$c.hasClass("cell-selected")) {
          $c.removeClass("bg-primary").addClass("bg-success font-weight-bold cell-selected");
          $c.css("box-shadow", "inset 0 0 5px rgba(0,0,0,0.5)");
        }
      });
      updateTaskCount();
    }

    // 主控机台自动选中判定
    if (mainMachine) {
      const $mainCell = $container.find("td[data-machine='" + mainMachine + "']");
      // 【防呆】：只有当它没有因为缓存回显变绿时，才去触发自动选中
      if ($mainCell.length > 0 && !$mainCell.hasClass("cell-selected")) {
        if (window.currentActionType === "HandOver") {
          $mainCell.click();
        } else {
          const machinePlans = allPlans.filter(p => p[4] && p[4].toString().substring(0,8) === mainMachine);
          const uniquePlansMap = new Map();
          machinePlans.forEach(p => { 
            const sku = p[9] ? p[9].toString().trim() : "";
            if (!sku || sku === "NA" || sku.startsWith("【|】")) return;
            if (!uniquePlansMap.has(sku)) uniquePlansMap.set(sku, p); 
          });
          const uniquePlans = Array.from(uniquePlansMap.values());
          
          if (uniquePlans.length === 1) {
            selectTaskAndHighlight(mainMachine, uniquePlans, $mainCell);
          } else if (uniquePlans.length > 1) {
            $mainCell.click();
          }
        }
      }
    }
  }

  /**
   * 弹出迷你计划拾取器（按日期班次SKU去重 + 显示前后3个班次 + 剩余量徽章）
   * @param {string} machine - 机台号
   * @param {jQuery} $cellDom - 单元格 DOM 元素
   * @param {Array} allPlans - 全部计划数据
   */
  function showPlanPicker(machine, $cellDom, allPlans) {
    // 1. 找出该机台所有的计划
    const rawMachinePlans = allPlans.filter(p => p[4] && p[4].toString().substring(0, 8) === machine);
    if (rawMachinePlans.length === 0) return;

    // ==========================================
    // 【计算当前班次坐标】
    // ==========================================
    let now = new Date();
    let nowHM = dayjs(now).format("HH:mm");
    let tDate = dayjs(now).format("YYYY-MM-DD");
    let nDate = dayjs(now.getTime() + 86400000).format("YYYY-MM-DD");
    let cShift = "";
    let cDate = tDate;
    
    // 动态判断当前所处的逻辑班次
    if (nowHM > "23:44" && nowHM <= "23:59") { 
      cShift = "夜"; cDate = nDate; 
    } else if (nowHM >= "00:00" && nowHM < "07:45") { 
      cShift = "夜"; cDate = tDate; 
    } else if (nowHM >= "07:45" && nowHM < "15:45") { 
      cShift = "早"; cDate = tDate; 
    } else { 
      cShift = "中"; cDate = tDate;
    }

    /**
     * 将日期班次转化为“绝对线性坐标”，方便计算相差了几个班
     */
    function getAbsShift(dStr, sStr) {
      if (!dStr || !sStr) return -99999;
      let days = dayjs(dStr).diff(dayjs("2020-01-01"), 'day');
      let sVal = { "夜": 1, "早": 2, "中": 3 }[sStr] || 0;
      return days * 3 + sVal;
    }
    
    let currentAbs = getAbsShift(cDate, cShift);

    // 2. 按 “日期 + 班次 + SKU” 提取并去重计划
    const uniquePlansMap = new Map();
    rawMachinePlans.forEach(p => {
      const sku = p[9] ? p[9].toString().trim() : "";
      if (!sku || sku === "NA" || sku.startsWith("【|】")) return;

      let pDate = dayjs(p[2]).format("YYYY-MM-DD");
      let pShift = p[3];
      let planAbs = getAbsShift(pDate, pShift);
      let diff = planAbs - currentAbs;

      // 【关键过滤】：只保留前后 3 个班次以内的计划
      if (Math.abs(diff) <= 3) {
        let uniqueKey = `${pDate}_${pShift}_${sku}`;
        if (!uniquePlansMap.has(uniqueKey)) {
          p._planAbs = planAbs;
          p._diff = diff;
          p._pDate = pDate;
          p._pShift = pShift;
          uniquePlansMap.set(uniqueKey, p);
        }
      }
    });
    
    let machinePlans = Array.from(uniquePlansMap.values());

    // 按照时间顺序（班次坐标）从小到大排序，方便查看趋势
    machinePlans.sort((a, b) => a._planAbs - b._planAbs);
    
    // 【防呆兜底】：如果过滤后全空了，强制找出绝对距离最近的1个
    if (machinePlans.length === 0) {
       let allValid = [];
       rawMachinePlans.forEach(p => {
          const sku = p[9] ? p[9].toString().trim() : "";
          if (!sku || sku === "NA" || sku.startsWith("【|】")) return;
          let pDate = dayjs(p[2]).format("YYYY-MM-DD");
          let pShift = p[3];
          p._planAbs = getAbsShift(pDate, pShift);
          p._diff = p._planAbs - currentAbs;
          p._pDate = pDate;
          p._pShift = pShift;
          allValid.push(p);
       });
       if (allValid.length > 0) {
          allValid.sort((a, b) => Math.abs(a._diff) - Math.abs(b._diff));
          machinePlans.push(allValid[0]);
       } else {
          return; // 真没数据
       }
    }

    // 3. 如果这台机器只有1条可用计划，直接静默选中，不弹窗！
    if (machinePlans.length === 1) {
      selectTaskAndHighlight(machine, [machinePlans[0]], $cellDom);
      return;
    }

    // 4. 构建带有高颜值徽章的多选 HTML 列表 (Checkbox)
    let customHtml = `
      <style>
        @keyframes dangerBlink {
          0%, 100% { color: #dc3545; text-shadow: 0 0 8px rgba(220,53,69,0.6); opacity: 1; }
          50% { color: #ff6b6b; text-shadow: none; opacity: 0.4; }
        }
        .danger-blink {
          animation: dangerBlink 1.2s ease-in-out infinite; font-weight: 900;
        }
      </style>
      <div id="plan-scroll-box" class="text-left" style="position: relative; max-height: 45vh; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 10px 20px;">
    `;
    
    machinePlans.forEach((p, index) => {
      let isCurrent = (p._diff === 0);
      let badgeColor = isCurrent ? '#28a745' : '#6c757d'; 
      let displayDateShift = `${dayjs(p._pDate).format("MM-DD")} ${p._pShift}班`;
      let leftQty = p[15] || 0; 
      let shiftKey = `${p._pDate}_${p._pShift}`; 

      let badgeHtml = `<span class="badge" style="margin-left:10px; font-size:0.8em; background-color:${badgeColor}; color:white; padding:4px 8px; border-radius:4px; vertical-align:text-bottom;">${displayDateShift} | 剩余: ${leftQty}</span>`;
      
      if (isCurrent) {
         badgeHtml += `<span class="badge" style="margin-left:4px; font-size:0.7em; background-color:#dc3545; color:white; padding:2px 4px; border-radius:4px; vertical-align:text-bottom;">当前</span>`;
      }

      let mainTitle = `SKU: <b style="font-size: 1.1em;">${p[9]}</b> ${badgeHtml}`;
      let subTitle = `<br><small class="text-muted" style="margin-left: 5px;">${p[7]}</small>`;
      
      customHtml += `
        <div class="custom-control custom-checkbox mb-3" style="border-bottom: 1px solid #f0f0f0; padding-bottom: 12px; transition: background-color 0.5s;">
          <input type="checkbox" id="planCheck_${index}" name="customPlanCheckbox" class="custom-control-input plan-checkbox" value="${index}" data-shiftkey="${shiftKey}">
          <label class="custom-control-label" for="planCheck_${index}" style="cursor: pointer; width: 100%; line-height: 1.5; margin-top: 2px;">
            ${mainTitle} ${subTitle}
          </label>
        </div>
      `;
    });
    customHtml += '</div>';

    Swal.fire({
      width: '80vw',
      title: `请选择 ${machine} 实际生产的产品<br><span style="font-size: 0.75em; color: #6c757d;">(可多选，<span class="danger-blink">不可漏选！</span>)</span>`,
      html: customHtml,
      showCancelButton: true,
      confirmButtonText: '确认添加',
      cancelButtonText: '取消',
      didOpen: () => {
        // ==========================================
        // 【终极修复 iPad & PC 滚动卡死】：阻止事件冒泡到外层遮罩
        // ==========================================
        let scrollBox = document.getElementById('plan-scroll-box');
        if (scrollBox) {
          scrollBox.addEventListener('touchmove', function(e) { e.stopPropagation(); }, { passive: false });
          scrollBox.addEventListener('wheel', function(e) { e.stopPropagation(); }, { passive: false });
          scrollBox.addEventListener('mousewheel', function(e) { e.stopPropagation(); }, { passive: false });
          scrollBox.addEventListener('DOMMouseScroll', function(e) { e.stopPropagation(); }, { passive: false });
        }

        // ==========================================
        // 【同班次“软联动”勾选】
        // ==========================================
        $(".plan-checkbox").on("change", function(e) {
          if (e.originalEvent) { 
            let isChecked = $(this).is(":checked");
            let shiftKey = $(this).data("shiftkey");
            
            if (isChecked) {
              let $uncheckeds = $(`.plan-checkbox[data-shiftkey='${shiftKey}']`).not(this).not(":checked");
              if ($uncheckeds.length > 0) {
                $uncheckeds.prop("checked", true);
                $uncheckeds.closest(".custom-checkbox").css("background-color", "#e8f0fe");
                setTimeout(() => {
                  $uncheckeds.closest(".custom-checkbox").css("background-color", "transparent");
                }, 600);
              }
            }
          }
        });
      },
      preConfirm: () => {
        let selectedIndices = [];
        $("input[name='customPlanCheckbox']:checked").each(function() {
          selectedIndices.push($(this).val());
        });
        if (selectedIndices.length === 0) {
          Swal.showValidationMessage('请至少选择一项正在生产的SKU！');
          return false;
        }
        return selectedIndices;
      }
    }).then((result) => {
      if (result.isConfirmed) {
        const selectedPlans = result.value.map(idx => machinePlans[idx]);
        selectTaskAndHighlight(machine, selectedPlans, $cellDom);
      }
    });
  }

  /**
   * 确认任务并高亮单元格（带双重去重拦截）
   * @param {string} machine - 机台号
   * @param {Array} selectedPlansArray - 选中的排产计划
   * @param {jQuery} $cellDom - 单元格 DOM
   */
  function selectTaskAndHighlight(machine, selectedPlansArray, $cellDom) {
    // 辅助函数：根据机台判定拌料类型
    function getMoldTypeByMachine(mac) {
      if ((mac.indexOf("FCS") !== -1 || mac.indexOf("E0E") !== -1) && mac !== "E0EN0009") return "自动模(自动拌料)";
      if ((mac.indexOf("FCS") !== -1 || mac.indexOf("E0E") !== -1) && mac === "E0EN0009") return "分步模(手工拌料)";
      if (mac.indexOf("H1HTA851") !== -1) return "分步模(自动拌料)";
      return "分步模(手工拌料)";
    }

    // 用于本次提交的 SKU 去重
    let seenSkus = new Set();
    
    selectedPlansArray.forEach(plan => {
      let sku = plan[9] ? plan[9].toString().trim() : "";
      
      // 防呆 1：如果本次提交已经包含过这个 SKU，跳过
      if (seenSkus.has(sku)) return;
      seenSkus.add(sku);

      // 防呆 2：如果全局自检队列中，已经存在这个组合，跳过
      let isExistInQueue = window.tempCheckQueue.some(t => t.machine === machine && t.sku === sku);
      if (isExistInQueue) return;

      // 解析隐藏信息
      let col11Str = plan[11] || "";
      let col11Parts = col11Str.split("【|】");
      let defect = col11Parts[1] || "";
      let shiftModel = col11Parts[3] || "";
      let pointCheck = col11Parts[4] || "";

      // 产品名称中包含 360，追加固定缺陷
      if (plan[7] && plan[7].toString().indexOf("360") !== -1) {
        defect = "舌苔平不可接受；" + defect;
      }

      // 推入全局队列
      window.tempCheckQueue.push({
        machine: machine,
        sku: sku,
        psku: plan[10] || "",
        moldModel: plan[8] ? plan[8].toString().substring(0, 8) : "",
        moldCell: plan[8] ? plan[8].toString().split("-")[1] : "",
        machineModel: plan[12] || "",
        machineType: machine.substring(2, 4),
        moldType: getMoldTypeByMachine(machine),
        selfCheckDefect: defect,
        pointCheckInfo: pointCheck,
        shiftModel: shiftModel
      });
    });
    
    // UI 高亮处理
    $cellDom.removeClass("bg-primary").addClass("bg-success font-weight-bold cell-selected");
    $cellDom.css("box-shadow", "inset 0 0 5px rgba(0,0,0,0.5)");
    updateTaskCount();
  }

  /**
   * 确认并跳转（附带交接班提前防呆拦截）
   */
  $("#btnConfirmMultiCheck").off("click").on("click", async function() {
    
    // 【交接班专属】：在进入页面前，提前拦截当班已做过交接班的机台
    if (window.currentActionType === "HandOver") {
       let arrInjAllHandOverRecord = await idbGet('sSArrInjAllHandOverRecord') || [];
       let alreadyDone = [];
       let validTasks = [];
       
       for (let task of window.tempCheckQueue) {
          let m = task.machine.split(",")[0].substring(0, 8);
          // 检查记录
          let isDone = arrInjAllHandOverRecord.some(v => v[0] == m);
          if (isDone) {
             alreadyDone.push(m);
          } else {
             validTasks.push(task);
          }
       }

       if (alreadyDone.length > 0) {
          await Swal.fire({
             icon: 'warning',
             title: '拦截提示',
             html: `以下机台当班已做过交接班：<br><b style="color:red; font-size:1.2em;">${alreadyDone.join(", ")}</b><br><br>系统已自动将其剔除。`
          });
       }
       
       if (validTasks.length === 0) {
          return; // 全做过了直接返回
       }
       
       sessionStorage.setItem("multiTaskQueue", JSON.stringify(validTasks));
       window.open(execUrl + "?v=HandOverCheck");
       $("#modalLayoutPicker").modal("hide");
       return;
    }

    // 其他逻辑 (自检/首件) 跳转
    sessionStorage.setItem("multiTaskQueue", JSON.stringify(window.tempCheckQueue));
    
    if (window.currentActionType === "FirstCheck") {
        window.open(execUrl + "?v=FirstCheck");
    } else if (window.currentActionType === "TechFirstCheck") {
        // 【新增】：设备首件路由
        window.open(execUrl + "?v=TechFirstCheck");
    } else {
        // 【新增】：如果是自检，将本次的选择和当前逻辑班次烙印到本地缓存中！
        if (window.currentActionType === "SelfCheck") {
            let cacheData = {
                shiftKey: getCurrentLogicalShift(),
                tasks: window.tempCheckQueue
            };
            localStorage.setItem("lastSelfCheckCache", JSON.stringify(cacheData));
        }
        window.open(execUrl + "?v=SelfCheck");
    }
    $("#modalLayoutPicker").modal("hide");
  });

    let nowDate = dayjs(now).format("YYYY-MM-DD");
    let nextDate = dayjs(new Date(now.getTime() + 24 * 3600 * 1000)).format("YYYY-MM-DD");
    let nowHourMinute = dayjs(now).format("HH:mm");
    
    let shift = 0;
    let nowDateShift = "";
    if (nowHourMinute > "23:44" && nowHourMinute < "24:00") { shift = 1; nowDateShift = nextDate + "_" + shift; } 
    else if (nowHourMinute >= "00:00" && nowHourMinute < "07:45") { shift = 1; nowDateShift = nowDate + "_" + shift; } 
    else if (nowHourMinute > "07:44" && nowHourMinute < "15:45") { shift = 2; nowDateShift = nowDate + "_" + shift; } 
    else if (nowHourMinute > "15:44" && nowHourMinute < "23:45") { shift = 3; nowDateShift = nowDate + "_" + shift; }

  /**
   * 表格中输入完成计算新的 PO 残留信息，并在页面呈现逻辑颜色变化
   * @param {HTMLElement} domTdInput - 输入框对象
   * @param {number} poDoneNum - 目前为止的已完成量
   */
  function calcPoInfo(domTdInput, poDoneNum) {
    let now = new Date();
    let nowHour = now.getHours();
    let nowMinute = now.getMinutes();
    
    if ((nowHour > 8 && nowHour < 14) || (nowHour == 14 && nowMinute < 45)) {
      Swal.fire("现在输入没有用，14:30分计划更新后，会清空数据，请在14:45后输入");
    } else {
      $("#swalRemind").text("");
      let tdSeqSwal = $(domTdInput).parent().index();
      let trSeqSwal = $(domTdInput).parent().parent().index();
      let tbodySwal = $(domTdInput).parent().parent().parent();
      let skuTotalPlanNum = Number($("#skuTotalPlanNum").text());
      let poPlanNum = Number(tbodySwal.find("tr").eq(trSeqSwal).find("td").eq(1).text());
      let poShiftNum = Number(tbodySwal.find("tr").eq(trSeqSwal).find("td").eq(4).find("input").eq(0).val());
      let newPoDoneNum = Number(poDoneNum) + poShiftNum;
      
      tbodySwal.find("tr").eq(trSeqSwal).find("td").eq(2).text(newPoDoneNum);
      tbodySwal.find("tr").eq(trSeqSwal).find("td").eq(3).text(poPlanNum - Number(poDoneNum) - poShiftNum);
      
      if (poPlanNum <= newPoDoneNum) {
        tbodySwal.find("tr").eq(trSeqSwal).css({ "background": "#B8B8B8" });
        tbodySwal.find("tr").eq(trSeqSwal).find("td").eq(4).css({ "background": "#B8B8B8" });
      } else {
        tbodySwal.find("tr").eq(trSeqSwal).css({ "background": "unset" });
        tbodySwal.find("tr").eq(trSeqSwal).find("td").eq(4).eq(0).css({ "background": "lightcyan" });
      }
      
      let rows = tbodySwal.find("tr").length;
      let totalDoneNum = 0;
      let arrRowLeft = [];
      let judgePoLeft = 0;
      
      for (let i = 0; i < rows; i++) {
        totalDoneNum = totalDoneNum + Number(tbodySwal.find("tr").eq(i).find("td").eq(2).text());
        arrRowLeft.push(Number(tbodySwal.find("tr").eq(i).find("td").eq(3).text()));
        
        if ((i < rows - 1 && Number(tbodySwal.find("tr").eq(i).find("td").eq(3).text()) < 0 && Number(tbodySwal.find("tr").eq(i + 1).find("td").eq(3).text()) == Number(tbodySwal.find("tr").eq(i + 1).find("td").eq(3).text())) || 
            (i > 0 && Number(tbodySwal.find("tr").eq(i).find("td").eq(4).find("input").eq(0).val()) > 0 && Number(tbodySwal.find("tr").eq(i - 1).find("td").eq(3).text()) > 0)) {
          judgePoLeft = judgePoLeft + 1;
        }
      }
      
      $("#skuTotalLeftNum").text(skuTotalPlanNum - totalDoneNum);
      
      if (judgePoLeft || (skuTotalPlanNum - totalDoneNum <= 0 && arrRowLeft.filter(v => v > 0).length > 0)) {
        $("#swalRemind").text("PO必须一个一个清；PO收货与输入必须同步");
      }
    }
  }

  /**
   * 判定特定月份一号是否需要备份系统数据
   * @param {Array} arrMonth - 触发备份的月份数组
   * @returns {string} - "Y" 或 "N"
   */
  function backupFrequency(arrMonth) {
    let now = new Date();
    let tomorrow = dayjs().add(1, 'days').format("YYYY-MM-DD");
    let tomorrowMonth = new Date(tomorrow).getMonth() + 1;
    let tomorrowDate = new Date(tomorrow).getDate();
    let nowHour = now.getHours();
    let nowMinute = now.getMinutes();
    let position = arrMonth.indexOf(tomorrowMonth);
    
    // 如果明日是目标备份月份的 1号，并且今晚已经超过 23:45 触发拦截图限制
    if (position != -1 && tomorrowDate == 1 && nowHour == 23 && nowMinute > 44) {
      return "Y";
    } else {
      return "N";
    }
  }

  /**
   * 自动生成带特定样式的 HTML 表格进行展示
   * @param {Array} data - 需要渲染的数据二维数组
   * @param {Number} scale - 宽度百分比
   * @param {string} type - 如果等于 PointCheckInfo，会带特定跑马灯特效
   * @returns {string} 拼装好的 HTML 表格代码
   */
  function General_Htmltable(data, scale, type) {
    let htmltable = "";
    if (data) {
      if (type == "PointCheckInfo") {
        htmltable += "<div style='color:red;font-size:medium'><marquee direction='right' scrollamount='5' behavior='alternate'>该机台及配套机台需要做以下类型的点检</marquee></div>";
      }
      let arrWidths = [8, 8, 8, 8, 8, 8, 8, 8, 8, 8, 20];
      htmltable += "<table border='1' style='table-layout:fixed;border-collapse:separate;font-size:small;color:red;width:" + scale + "%;'>";
      for (let i = 0; i < data.length; i++) {
        htmltable += "<tr>";
        for (let j = 0; j < data[i].length; j++) {
          if (i == 0) {
            htmltable += "<td style=';text-align:center;background-color:#CCFFFF;color:black;font-weight:bold;width:" + arrWidths[j] + "%'>" + data[i][j].toString().replace(/\n/g, "<br>") + "</td>";
          } else if (i > 0 && i % 2 == 0) {
            if (data[i][j] && data[i][j].toString().indexOf("不在范围") != -1) {
              htmltable += "<td style=';text-align:center;background-color:#E8E8E8'><a>不在范围</a><a style='color:#E8E8E8'>" + data[i][j].toString().replace(/\n/g, "<br>") + "</a></td>";
            } else {
              htmltable += "<td style=';text-align:center;background-color:#E8E8E8'>" + data[i][j].toString().replace(/\n/g, "<br>") + "</td>";
            }
          } else {
            if (data[i][j] && data[i][j].toString().indexOf("不在范围") != -1) {
              htmltable += "<td style=';text-align:center;'><a>不在范围</a><a style='color:white'>" + data[i][j].toString().replace(/\n/g, "<br>") + "<a></td>";
            } else {
              htmltable += "<td style=';text-align:center'>" + data[i][j].toString().replace(/\n/g, "<br>") + "</td>";
            }
          }
        }
        htmltable += "</tr>";
      }
      htmltable += "</table>";
    }
    return htmltable;
  }

  /*=================================================
   * 【隐藏彩蛋】：双击刷新图标，强制拉取最新 BOM/工艺标准
   *=================================================*/
  $(document).on("dblclick", "#btnForceSyncData", function(e) {
    e.preventDefault(); // 阻止默认选中文本行为
    
    Swal.fire({
      title: '强制更新主数据?',
      text: "这将会清空本地缓存，并重新从服务器拉取最新的排产、BOM和工艺标准，确定执行吗？",
      icon: 'warning',
      showCancelButton: true,
      confirmButtonColor: '#d33',
      cancelButtonColor: '#6c757d',
      confirmButtonText: '确定更新',
      cancelButtonText: '取消'
    }).then(async (result) => { // 【核心修改】：加上 async，让我们可以等待断开连接
      if (result.isConfirmed) {

        // 先弹出一个不可关闭的加载中遮罩，防止用户中途乱点
        Swal.fire({
          title: '正在深度清理本地缓存...',
          allowOutsideClick: false,
          didOpen: () => { Swal.showLoading() }
        });

        // 1. 直接干掉本地的“保质期戳”，确保证明已过期
        localStorage.removeItem("staticDataExpireTime");
        
        // 【终极修复】：在粉碎数据库之前，必须先主动切断当前页面一直保持开启的数据库连接！
        if (typeof dbPromise !== 'undefined' && dbPromise !== null) {
          try {
            let db = await dbPromise;
            db.close(); // 释放当前页面的占用锁
            dbPromise = null;
          } catch (err) { console.warn("关闭当前DB连接出错", err); }
        }

        // 2. 暴力粉碎整个 cp_app_db 数据库
        let deleteReq = indexedDB.deleteDatabase("cp_app_db");

        // 必须等数据库彻底删完（onsuccess），再进行页面刷新！
        deleteReq.onsuccess = function() {
          console.log("IndexedDB 本地大数据库已被彻底粉碎清空！");
          Swal.fire({
            allowOutsideClick: false,
            title: '清理完毕',
            text: '正在重启系统拉取最新数据...',
            icon: 'success',
            timer: 1200,
            showConfirmButton: false
          }).then(() => {
            // 确保旧的 IndexedDB 死透了，再强刷当前页面
            window.location.reload();
          });
        };

        deleteReq.onerror = function() {
          console.error("清除 IndexedDB 失败");
          Swal.fire('清理失败', '缓存清除失败，请手动清理浏览器缓存！', 'error');
        };

        // 工业级防呆：如果用户开了两个该系统的网页，IndexedDB 会被死锁拦截
        deleteReq.onblocked = function () {
          console.warn("数据库删除被拦截：有其他标签页正在使用数据库。");
          Swal.fire({
            icon: 'warning', 
            title: '清理被拦截', 
            html: '发现您还在其他标签页打开了本系统。<br><br><b>请先关闭其他浏览器的系统标签页</b>，然后再点击清理重试！'
          });
        };
      }
    });
  });
  
</script>
